// ── POWERLIFTING PEAKING BLOCK (12-week + Wk13 retest, 4x/week) ───────────────────────────────
// Research-backed structure: Wk1 testing, Wk2-4 accumulation (65-75%), Wk5 deload,
// Wk6-8 intensification (77-87%), Wk9-11 peaking (88-94%), Wk12 taper/meet (openers
// @90%, intensity held, volume cut, accessories dropped). Day4 is a lower-fatigue
// technique day (paused squat/deficit deadlift) — no extra back squat/deadlift.
const PL_PHASE_NOTE={
  'Accumulation':'Accumulation phase — building volume at moderate intensity.',
  'Deload':'Deload week — reduced volume and intensity. Let fatigue dissipate before intensity climbs.',
  'Intensification':'Intensification phase — load climbing, volume easing off.',
  'Peaking':'Peaking phase — low volume, high intensity. Stay sharp on technique.',
  'Taper / Meet Week':'Meet-week opener practice — confident, crisp singles. No accessories this week — rest fully into the meet.',
};
const PL_WEEKS=[

  {week:6,phase:'Intensification',mainPct:77,mainSets:4,repLo:4,repHi:4,mainRpe:8,mainRest:180,d4Pct:67,d4Sets:3,d4RepLo:3,d4RepHi:4,d4Rpe:7,d4Rest:150,accSets:2,accRest:75,hasDay4:true},
  {week:7,phase:'Intensification',mainPct:82,mainSets:3,repLo:3,repHi:3,mainRpe:8,mainRest:240,d4Pct:72,d4Sets:3,d4RepLo:3,d4RepHi:4,d4Rpe:7,d4Rest:150,accSets:2,accRest:75,hasDay4:true},

function plPctEx(n,pctOf,pct,s,lo,hi,rpe,rest,cue){return{...ex(n,s,lo,hi,'Compound',rpe,cue||'',rest),pctOf,pct};}
function plMaxEx(n,pctOf,rest,cue){return{...ex(n,1,1,1,'Max',10,cue||'',rest),pctOf};}
function plAccEx(n,s,lo,hi,rest,cue){return s>0?ex(n,s,lo,hi,'Isolation',8,cue||'',rest):null;}
function buildPLSessions(){
  const sessions=[];
  sessions.push({key:'w1d1',label:'Week 1 • Squat Max Test',exercises:[
    plMaxEx('Competition Squat','squat',240,'Warm up thoroughly in small jumps, then work up to a true 1-rep max with safety bars/a spotter. Allow 30–45 min including warm-up.')
  ]});
  sessions.push({key:'w1d2',label:'Week 1 • Bench Max Test',exercises:[
    plMaxEx('Competition Bench Press','bench',240,'Warm up thoroughly, then work up to a true 1-rep max with a spotter. Allow 30–45 min including warm-up.')

    plMaxEx('Competition Deadlift','deadlift',240,'Warm up thoroughly, then work up to a true 1-rep max. Allow 30–45 min including warm-up.')
  ]});
  for(const w of PL_WEEKS){
    if(w.week===12)continue;
    const wk=w.week,note=PL_PHASE_NOTE[w.phase];
    const benchAcc=n=>plAccEx('Paused Bench Press',n,6,10,75,'');
    sessions.push({key:'w'+wk+'d1',label:'Week '+wk+' • Squat Day',exercises:[
      plPctEx('Competition Squat','squat',w.mainPct,w.mainSets,w.repLo,w.repHi,w.mainRpe,w.mainRest,note),
      benchAcc(w.accSets),
      plAccEx('Leg Extension Machine',w.accSets,12,15,w.accRest,''),
      plAccEx('Hip Thrust',w.accSets,10,15,w.accRest,''),
    ].filter(Boolean)});
    sessions.push({key:'w'+wk+'d2',label:'Week '+wk+' • Bench Day',exercises:[
      plPctEx('Competition Bench Press','bench',w.mainPct,w.mainSets,w.repLo,w.repHi,w.mainRpe,w.mainRest,note),
      benchAcc(w.accSets),
      plAccEx('Cable Overhead Tricep Extension',w.accSets,10,12,w.accRest,''),
      plAccEx('Cable Chest Fly',w.accSets,12,15,w.accRest,''),
    ].filter(Boolean)});
    sessions.push({key:'w'+wk+'d3',label:'Week '+wk+' • Deadlift Day',exercises:[
      plPctEx('Competition Deadlift','deadlift',w.mainPct,w.mainSets,w.repLo,w.repHi,w.mainRpe,w.mainRest,note),
      benchAcc(w.accSets),
      plAccEx('Seated Leg Curl',w.accSets,10,12,w.accRest,''),
      plAccEx('Back Extension',w.accSets,10,15,w.accRest,''),
    ].filter(Boolean)});
    if(w.hasDay4){
      sessions.push({key:'w'+wk+'d4',label:'Week '+wk+' • Technique Day',exercises:[
        plPctEx('Paused Squat','squat',w.d4Pct,w.d4Sets,w.d4RepLo,w.d4RepHi,w.d4Rpe,w.d4Rest,'Technique-focused, lower-fatigue session — no additional back squat today.'),
        plPctEx('Deficit Deadlift','deadlift',w.d4Pct,w.d4Sets,w.d4RepLo,w.d4RepHi,w.d4Rpe,w.d4Rest,''),
        plAccEx('Weighted Plank',w.accSets,30,45,w.accRest,'Reps field = seconds held per set.'),
        plAccEx('Cable Crunch',w.accSets,12,15,w.accRest,''),
      ].filter(Boolean)});
    }
  }
  const w12=PL_WEEKS.find(w=>w.week===12),note12=PL_PHASE_NOTE[w12.phase];
  sessions.push({key:'w12d1',label:'Week 12 • Squat Opener',exercises:[
    plPctEx('Competition Squat','squat',w12.mainPct,w12.mainSets,w12.repLo,w12.repHi,w12.mainRpe,w12.mainRest,note12)
  ]});
  sessions.push({key:'w12d2',label:'Week 12 • Bench Opener',exercises:[
    plPctEx('Competition Bench Press','bench',w12.mainPct,w12.mainSets,w12.repLo,w12.repHi,w12.mainRpe,w12.mainRest,note12)
  ]});
  sessions.push({key:'w12d3',label:'Week 12 • Deadlift Opener',exercises:[
    plPctEx('Competition Deadlift','deadlift',w12.mainPct,w12.mainSets,w12.repLo,w12.repHi,w12.mainRpe,w12.mainRest,note12)
  ]});
  // Week 13 — max retest. Three attempts per lift: opener (90%), second (95%), then a new 1RM.
  // Attempt 3 is a 'Max' set, so the weight you log updates your stored 1RM, same as Week 1.
  const RT_NOTE='Retest week — compare today’s top single with your Week 1 max. Warm up in small jumps first (30–45 min total), use a spotter/safety bars, and take full rest between attempts.';
  const retest=(label,key,lift,name,restA)=>{
    sessions.push({key:key,label:'Week 13 • '+label,exercises:[
      plPctEx(name+' — Attempt 1',lift,90,1,1,1,8,240,'Opener — fast and crisp, should feel easy. '+RT_NOTE),
      plPctEx(name+' — Attempt 2',lift,95,1,1,1,9,restA,'Second attempt — heavy but controlled. Only continue if attempt 1 moved well.'),
      {...plMaxEx(name+' — Attempt 3 (New Max)',lift,restA,'Go for a new 1-rep max. Log the heaviest weight you complete — it replaces your stored 1RM. Stop at attempt 2 if form or bar speed has dropped.')}
    ]});
  };
  retest('Squat Retest','w13d1','squat','Competition Squat',300);
  retest('Bench Retest','w13d2','bench','Competition Bench Press',300);
  retest('Deadlift Retest','w13d3','deadlift','Competition Deadlift',300);
  return sessions;
}

];
const TRAIN_FREQS=[
  {v:'0-2',t:'0-2 sessions/week',add:0.00},
  {v:'3-4',t:'3-4 sessions/week',add:0.10},
  {v:'5-6',t:'5-6 sessions/week',add:0.20},
  {v:'7+',t:'7+ sessions/week',add:0.30},
];

function prevBest(hist,label,name){for(const h of hist){if(h.label!==label)continue;const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.sets&&e.sets.length){const ws=e.sets.map(s=>s.kg||0).filter(w=>w>0);if(ws.length)return Math.max(...ws);}}return null;}
function allBest(hist,name){let b=null;for(const h of hist){const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.sets&&e.sets.length){const ws=e.sets.map(s=>s.kg||0).filter(w=>w>0);if(ws.length){const m=Math.max(...ws);if(b===null||m>b)b=m;}}}return b;}
function prevBestMetres(hist,label,name){for(const h of hist){if(h.label!==label)continue;const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.sets&&e.sets.length){const ms=e.sets.map(s=>s.reps||0).filter(m=>m>0);if(ms.length)return Math.max(...ms);}}return null;}
function allBestMetres(hist,name){let b=null;for(const h of hist){const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.sets&&e.sets.length){const ms=e.sets.map(s=>s.reps||0).filter(m=>m>0);if(ms.length){const m=Math.max(...ms);if(b===null||m>b)b=m;}}}return b;}
function lastNotes(hist,label,name){for(const h of hist){if(h.label!==label)continue;const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.notes)return e.notes;}return '';}
function nextSess(pid,hist){const ss=PROGS[pid].sessions;const core=ss.filter(s=>!s.optional);const ph=hist.filter(h=>h.planId===pid);if(!ph.length)return core[0].label;const lc=ph.find(h=>core.some(s=>s.label===h.label));if(!lc)return core[0].label;const idx=core.findIndex(s=>s.label===lc.label);return core[(idx+1)%core.length].label;}

// ── AUTH ──────────────────────────────────────────────────────────────────────
function Auth({initialMsg}){
  const [mode,setMode]=useState('signin'); // 'signin' | 'forgot'
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [msg,setMsg]=useState(initialMsg||'');
  const [busy,setBusy]=useState(false);

  async function submit(){
    setErr('');setMsg('');
    const em=email.trim();
    if(mode==='forgot'){
      if(!em){setErr('Enter your email');return;}
      setBusy(true);
      try{
        const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:window.location.origin+window.location.pathname});
        if(error)throw error;
        setMsg('Check your email for a password reset link.');
      }catch(e){setErr(e.message||'Something went wrong');}
      setBusy(false);
      return;
    }
    if(!em||!pw){setErr('Enter your email and password');return;}
    if(pw.length<6){setErr('Password must be at least 6 characters');return;}
    setBusy(true);
    try{
      const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error)throw error;
    }catch(e){setErr(e.message||'Something went wrong');}
    setBusy(false);
  }

  async function startCheckout(){
    setErr('');setBusy(true);
    try{
      const res=await fetch('/api/create-checkout-session',{method:'POST'});
      const data=await res.json();
      if(!res.ok||!data.url)throw new Error(data.error||'Could not start checkout');
      window.location.href=data.url;
    }catch(e){setErr(e.message||'Something went wrong');setBusy(false);}
  }

  const title=mode==='signin'?'Welcome back':'Reset your password';

  return(
    <div style={{position:'fixed',inset:0,background:'#0A0A0A',display:'flex',flexDirection:'column',justifyContent:'center',padding:'32px 24px'}}>
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{fontSize:13,fontWeight:800,color:A,letterSpacing:'0.1em',marginBottom:10}}>CONSTANTINE FITNESS</div>
        <div style={{fontSize:24,fontWeight:800}}>{title}</div>
        {mode==='forgot'&&<div style={{fontSize:13,color:'#9CA3AF',marginTop:8,lineHeight:1.5}}>Enter your email and we'll send you a link to reset your password.</div>}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <input value={email} onChange={e=>{setEmail(e.target.value);setErr('');}} placeholder="Email" type="email" autoComplete="email" autoCapitalize="none"
          style={{height:52,borderRadius:12,background:S,border:'1px solid '+(err?R:B),color:'#fff',fontSize:16,padding:'0 16px'}}/>
        {mode!=='forgot'&&<input value={pw} onChange={e=>{setPw(e.target.value);setErr('');}} placeholder="Password" type="password" autoComplete="current-password"
          style={{height:52,borderRadius:12,background:S,border:'1px solid '+(err?R:B),color:'#fff',fontSize:16,padding:'0 16px'}}/>}
        {err&&<div style={{fontSize:13,color:R}}>{err}</div>}
        {msg&&<div style={{fontSize:13,color:A}}>{msg}</div>}
      </div>
      {mode==='signin'&&<Btn onClick={()=>{setMode('forgot');setErr('');setMsg('');}} ch="Forgot password?" style={{alignSelf:'flex-end',marginTop:10,color:'#9CA3AF',fontSize:13,fontWeight:600}}/>}
      <Btn onClick={submit} dis={busy} ch={busy?'...':mode==='signin'?'Sign In':'Send Reset Link'}
        style={{width:'100%',height:54,borderRadius:12,background:'linear-gradient(135deg,#0C4A6E,'+A+')',color:'#000',fontSize:17,fontWeight:800,marginTop:20}}/>
      {mode==='forgot'
        ?<Btn onClick={()=>{setMode('signin');setErr('');setMsg('');}} ch="Back to sign in" style={{width:'100%',height:44,marginTop:12,color:'#9CA3AF',fontSize:13,fontWeight:600}}/>
        :<Btn onClick={startCheckout} dis={busy} ch="Don't have an account? Get lifetime access" style={{width:'100%',height:44,marginTop:12,color:'#9CA3AF',fontSize:13,fontWeight:600}}/>}
    </div>
  );
}

          const est=isPlyoSess?Math.round((s.exercises.reduce((a,e)=>a+e.sets*((e.workS||0)+(e.rest||90)),0)/60+5)/5)*5:Math.round((tot*3.2+s.exercises.length*1.2)/5)*5;

            <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>{s.label}</div>
            <div style={{fontSize:12,color:'#9CA3AF'}}>{s.exercises.length} exercises &bull; {tot} sets &bull; ~{est} min</div>
          </>} onClick={()=>onStart(s,view)}/>;
        })}
      </div>
    </FS>
  );
}

                style={{width:26,height:26,borderRadius:'50%',background:'#1E1E1E',border:'1px solid '+B,color:'#9CA3AF',fontSize:13}}/>}

              <div style={{fontSize:11,color:'#6B7280'}}>{e.cue}</div>

              <div style={{fontSize:12,color:'#9CA3AF',marginBottom:2}}>{e.sets} sets &times; {e.rLo}&ndash;{e.rHi} reps</div>

              {e.cue&&<div style={{fontSize:11,color:'#6B7280',marginTop:2}}>{e.cue}</div>}

// ── ACTIVE WORKOUT ────────────────────────────────────────────────────────────
function ActiveWorkout({planId,sess,hist,unit,swaps,onSaveSwap,onDone,onExit,oneRM,onSetPR}){
  const skKey=(i)=>planId+'_'+sess.label+'_'+i;
  const buildOne=(e0,i,name)=>{
    const e=(name!==e0.name&&e0.alts&&e0.alts[name])?{...e0,...e0.alts[name]}:e0;
    if(e.type==='Plyo'||e.type==='Distance'){
      return{...e,name,base:e.name,ei:i,pb:null,atb:null,
        pn:lastNotes(hist,sess.label,name),notes:'',
        logged:[]};
    }
    if(e.type==='Interval'){
      return{...e,name,base:e.name,ei:i,pb:prevBestMetres(hist,sess.label,name),atb:allBestMetres(hist,name),
        pn:lastNotes(hist,sess.label,name),notes:'',
        logged:[],curR:''};
    }
    const pb=prevBest(hist,sess.label,name);
    const target=(e.pctOf&&e.pct!=null&&oneRM&&oneRM[e.pctOf])?roundPlate(oneRM[e.pctOf]*e.pct/100):null;
    return{...e,name,base:e.name,ei:i,pb,atb:allBest(hist,name),
      pn:lastNotes(hist,sess.label,name),notes:'',
      logged:[],  // completed sets
      curW:target!=null?String(toDisp(target,unit)):(pb!=null?String(toDisp(pb,unit)):''),
      curR:'',curRpe:''};
  };
  const buildEx=()=>sess.exercises.map((e0,i)=>buildOne(e0,i,(swaps&&swaps[skKey(i)])||e0.name));

  // All hooks first
  const [exs,setExs]=useState(buildEx);
  const [ei,setEi]=useState(0);
  const [pr,setPr]=useState(null);
  const [showSwap,setShowSwap]=useState(false);
  const [secs,setSecs]=useState(0);
  const [totSecs,setTotSecs]=useState(0);
  const [showCancel,setShowCancel]=useState(false);
  const [showList,setShowList]=useState(false);
  const [workSecs,setWorkSecs]=useState(0);
  const tmr=useRef(null);
  const t0=useRef(Date.now());
  const tx=useRef(null);
  const workTmr=useRef(null);
  const workT0=useRef(Date.now());
  const restEnd=useRef(0);      // timestamp the rest period ends - keeps time correctly while the phone is locked
  const audioCtx=useRef(null);
  const wakeRef=useRef(null);
  const [editIdx,setEditIdx]=useState(null); // index of a logged set being edited
  const [ed,setEd]=useState({w:'',r:'',t:''});
  // Keep the screen awake for the whole workout (re-acquired when the app comes back to the front)
  function requestWake(){
    try{
      if('wakeLock' in navigator&&document.visibilityState==='visible'&&!wakeRef.current){
        navigator.wakeLock.request('screen').then(l=>{wakeRef.current=l;l.addEventListener('release',()=>{wakeRef.current=null;});}).catch(()=>{});
      }
    }catch(e){}
  }
  useEffect(()=>{
    requestWake();
    const onVis=()=>{
      if(document.visibilityState!=='visible')return;
      if(restEnd.current)tickRest();
      if(workTmr.current)setWorkSecs(Math.round((Date.now()-workT0.current)/1000));
      requestWake();
    };
    document.addEventListener('visibilitychange',onVis);
    return()=>{document.removeEventListener('visibilitychange',onVis);try{wakeRef.current&&wakeRef.current.release();}catch(e){}wakeRef.current=null;};
    // eslint-disable-next-line
  },[]);

  useEffect(()=>()=>{if(tmr.current)clearInterval(tmr.current);if(workTmr.current)clearInterval(workTmr.current);},[]);

  const cur=exs[ei];
  const setsDone=cur.logged.length;
  const setsTotal=cur.sets;
  const allSetsDone=setsDone>=setsTotal;
  // Skip & come back: the next exercise is the next unfinished one after this, wrapping round to any skipped earlier
  const unfinished=j=>exs[j].logged.length<exs[j].sets;
  const nextIdx=(()=>{for(let k=1;k<exs.length;k++){const j=(ei+k)%exs.length;if(unfinished(j))return j;}return -1;})();
  const isLastEx=nextIdx===-1;
  const doneCount=exs.filter(x=>x.logged.length>=x.sets).length;
  const loggedSets=exs.reduce((a,x)=>a+Math.min(x.logged.length,x.sets),0);
  const pct=Math.round(loggedSets/Math.max(1,exs.reduce((a,x)=>a+x.sets,0))*100);

  // Auto stopwatch for Distance-type sets — starts once rest has ended (or immediately if no rest is active), stops on Log Set
  const resting=secs>0;
  useEffect(()=>{
    if(workTmr.current)clearInterval(workTmr.current);
    if(cur.type==='Distance'&&!allSetsDone&&!resting){
      workT0.current=Date.now();
      setWorkSecs(0);
      workTmr.current=setInterval(()=>setWorkSecs(Math.round((Date.now()-workT0.current)/1000)),500);
    } else {
      setWorkSecs(0);
    }
    return ()=>{if(workTmr.current)clearInterval(workTmr.current);};
    // eslint-disable-next-line
  },[ei,setsDone,resting]);

  // Audio must be unlocked by a tap (iOS) - this runs from the Log Set tap that starts the rest
  function primeAudio(){
    try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      if(!audioCtx.current)audioCtx.current=new AC();
      if(audioCtx.current.state==='suspended')audioCtx.current.resume();}catch(e){}
  }
  function beep(){
    try{
      const c=audioCtx.current;
      if(c){[0,0.3,0.6].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;
        const t=c.currentTime+d;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
        o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.25);});}
      if(navigator.vibrate)navigator.vibrate([250,120,250]);
    }catch(e){}
  }
  function tickRest(){
    if(!restEnd.current)return;
    const left=Math.max(0,Math.ceil((restEnd.current-Date.now())/1000));
    setSecs(left);
    if(left<=0){
      if(tmr.current)clearInterval(tmr.current);tmr.current=null;
      const late=Date.now()-restEnd.current;restEnd.current=0;
      if(late<4000)beep();
    }
  }
  function startRest(s){
    if(tmr.current)clearInterval(tmr.current);
    primeAudio();
    restEnd.current=Date.now()+s*1000;
    setSecs(s);setTotSecs(s);
    tmr.current=setInterval(tickRest,250);
  }
  function addRest(n){if(!restEnd.current)return;restEnd.current+=n*1000;setTotSecs(t=>t+n);tickRest();}
  function stopRest(){if(tmr.current)clearInterval(tmr.current);tmr.current=null;restEnd.current=0;setSecs(0);setTotSecs(0);}

  function logSet(){
    if(cur.type==='Plyo'){
      const newLogged=[...cur.logged,{kg:0,reps:cur.reps,rpe:null,w:'',r:String(cur.reps)}];
      setExs(p=>p.map((e,i)=>i!==ei?e:{...e,logged:newLogged}));
      startRest(cur.rest||90);
      return;
    }
    if(cur.type==='Distance'){
      const elapsed=Math.round((Date.now()-workT0.current)/1000);
      const newLogged=[...cur.logged,{kg:0,reps:cur.metres,rpe:null,w:'',r:String(cur.metres),t:elapsed}];
      setExs(p=>p.map((e,i)=>i!==ei?e:{...e,logged:newLogged}));
      startRest(cur.rest||90);
      return;
    }
    if(cur.type==='Interval'){
      const metres=parseFloat(cur.curR)||0;
      if(!metres)return;
      const isPR=cur.atb===null||metres>cur.atb;
      const newLogged=[...cur.logged,{kg:0,reps:metres,rpe:null,w:'',r:cur.curR}];
      setExs(p=>p.map((e,i)=>i!==ei?e:{...e,
        atb:isPR?metres:e.atb,
        logged:newLogged,
        curR:''}));
      if(isPR)setPr({name:cur.name,metres});
      startRest(cur.rest||180);
      return;
    }
    const kg=(parseFloat(cur.curW)||0)*(unit==='kg'?1:0.4536);
    const reps=parseFloat(cur.curR)||0;
    if(!reps)return; // need at least reps
    if(cur.type==='Max'&&cur.pctOf&&kg>0&&onSetPR)onSetPR(cur.pctOf,kg);
    const isPR=kg>0&&(cur.atb===null||kg>cur.atb);
    const hitTop=reps>=cur.rHi;
    const newLogged=[...cur.logged,{kg,reps,rpe:null,w:cur.curW,r:cur.curR}];
    setExs(p=>p.map((e,i)=>i!==ei?e:{...e,
      atb:isPR?kg:e.atb,
      hitTop:e.hitTop||hitTop,
      logged:newLogged,
      curW:cur.curW,
      curR:'',curRpe:''}));
    if(isPR)setPr({name:cur.name,kg});
    const willBeLastSet=(setsDone+1)>=setsTotal;
    if(!(sess.noRestBetweenExercises&&willBeLastSet)){
      startRest(cur.rest!=null?cur.rest:(cur.type==='Compound'?120:60));
    }
  }

  function goTo(j){
    if(j<0||j>=exs.length)return;
    setEi(j);setPr(null);stopRest();setShowList(false);setShowSwap(false);setEditIdx(null);
  }
  const isRepType=x=>x.type!=='Plyo'&&x.type!=='Distance'&&x.type!=='Interval';
  const W_STEP=unit==='kg'?2.5:5;
  function stepW(d){
    setExs(p=>p.map((ex,i)=>{if(i!==ei)return ex;const v=parseFloat(ex.curW)||0;const nv=Math.max(0,Math.round((v+d*W_STEP)*100)/100);return{...ex,curW:String(nv)};}));
  }
  const stepBtn={width:44,height:56,flexShrink:0,borderRadius:10,background:'#1A1A1A',border:'1px solid #2A2A2A',color:'#fff',fontSize:24,fontWeight:700,cursor:'pointer',fontFamily:'inherit',padding:0};
  function openEdit(i){
    const st=cur.logged[i];if(!st)return;
    setEd({w:st.w!=null?String(st.w):'',r:st.r!=null&&st.r!==''?String(st.r):String(st.reps||''),t:st.t!=null?fmtTime(st.t):''});
    setEditIdx(i);
  }
  function applyLogged(nl){
    setExs(p=>p.map((x,i)=>{
      if(i!==ei)return x;
      const rep=isRepType(x);
      let atb=x.atb;
      if(rep||x.type==='Interval'){
        const base=x.type==='Interval'?allBestMetres(hist,x.name):allBest(hist,x.name);
        const vals=nl.map(q=>x.type==='Interval'?q.reps:q.kg).filter(v=>v>0);
        atb=vals.length?Math.max(base==null?0:base,...vals):base;
      }
      return{...x,logged:nl,atb,hitTop:rep?nl.some(q=>q.reps>=x.rHi):x.hitTop};
    }));
    setEditIdx(null);setPr(null);
  }
  function saveEdit(){
    const st=cur.logged[editIdx];if(!st)return;
    let ns={...st};
    if(cur.type==='Distance'){
      const m=/^(\d+):(\d{1,2})$/.exec(ed.t.trim());const t=m?(+m[1])*60+(+m[2]):parseFloat(ed.t);
      if(!(t>0))return;ns.t=Math.round(t);
    }else{
      const r=parseFloat(ed.r)||0;if(!r)return;
      ns={...ns,reps:r,r:ed.r};
      if(isRepType(cur)){const w=parseFloat(ed.w)||0;ns={...ns,kg:w*(unit==='kg'?1:0.4536),w:ed.w};
        if(cur.type==='Max'&&cur.pctOf&&ns.kg>0&&onSetPR)onSetPR(cur.pctOf,ns.kg);}
    }
    applyLogged(cur.logged.map((x,j)=>j===editIdx?ns:x));
  }
  function deleteSet(){applyLogged(cur.logged.filter((x,j)=>j!==editIdx));}
  const edField=(label,key,mode)=>(
    <div style={{flex:1}}>
      <div style={{fontSize:11,color:'#6B7280',fontWeight:600,marginBottom:6,textAlign:'center'}}>{label}</div>
      <input value={ed[key]} onChange={e=>setEd({...ed,[key]:e.target.value})} type="text" inputMode={mode} autoComplete="off"
        style={{width:'100%',height:52,background:'#0A0A0A',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:20,fontWeight:700,textAlign:'center',outline:'none'}}/>
    </div>);
  function nextExercise(){
    if(nextIdx!==-1)goTo(nextIdx);
  }
  function skipExercise(){
    if(nextIdx===-1)return;
    setExs(p=>p.map((x,i)=>i!==ei?x:{...x,skipped:true}));
    goTo(nextIdx);
  }

  function doSwap(nm){
    onSaveSwap(skKey(cur.ei),nm);
    setExs(p=>p.map((e,i)=>{
      if(i!==ei)return e;
      if(sess.exercises[i]&&sess.exercises[i].alts)return buildOne(sess.exercises[i],i,nm);
      if(e.type==='Interval'){
        return{...e,name:nm,pb:prevBestMetres(hist,sess.label,nm),atb:allBestMetres(hist,nm),pn:lastNotes(hist,sess.label,nm)};
      }
      const pb=prevBest(hist,sess.label,nm);
      return{...e,name:nm,pb,atb:allBest(hist,nm),pn:lastNotes(hist,sess.label,nm),
        curW:pb!=null?String(toDisp(pb,unit)):e.curW};
    }));
    setShowSwap(false);
  }

  function finish(){
    let vol=0;const prs=[];const toIncrease=[];
    const data=exs.map(e=>{
      e.logged.forEach(s=>{const kg=s.kg||0;vol+=kg*(s.reps||0);
        if(kg>0&&(()=>{const hb=allBest(hist,e.name);return hb===null||kg>hb;})()&&!prs.find(p=>p.name===e.name))prs.push({name:e.name,weight:toDisp(kg,unit)});});
      if(e.hitTop)toIncrease.push(e.name);
      return{name:e.name,rHi:e.rHi||null,type:e.type,notes:e.notes||'',
        sets:e.logged.map(s=>({kg:s.kg||0,reps:s.reps||0,rpe:s.rpe,t:s.t!=null?s.t:null}))};
    }).filter(e=>e.sets.length||e.notes);
    onDone({planId,label:sess.label,date:new Date().toISOString(),vol:Math.round(vol),exercises:data},prs,Math.round((Date.now()-t0.current)/60000),toIncrease);
  }

  const lh=hist.find(h=>h.label===sess.label&&h.exercises&&h.exercises.find(x=>x.name===cur.name));
  const lEx=lh&&lh.exercises.find(x=>x.name===cur.name);

  // Primary action button label
  let actionLabel, actionFn, actionStyle;
  if(allSetsDone && isLastEx){
    actionLabel='Finish Workout \u2713';
    actionFn=finish;
    actionStyle={background:'#10B981'};
  } else if(allSetsDone){
    actionLabel=nextIdx<ei?('Back to '+exs[nextIdx].name+' \u203a'):'Next Exercise \u203a';
    actionFn=nextExercise;
    actionStyle={background:'linear-gradient(135deg,#0C4A6E,'+A+')'};
  } else {
    actionLabel='Log Set '+(setsDone+1)+' of '+setsTotal;
    actionFn=logSet;
    actionStyle={background:'linear-gradient(135deg,#0C4A6E,'+A+')'};
  }

  const workout=(
    <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'#0A0A0A',zIndex:9999,display:'flex',flexDirection:'column'}}>

      {/* Header */}
      <div style={{background:'#0F0F0F',borderBottom:'1px solid #1E1E1E',padding:'48px 16px 14px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          {/* Progress bar */}
          <div style={{flex:1,height:3,background:'#1E1E1E',borderRadius:2,marginRight:12}}>
            <div style={{height:'100%',width:pct+'%',background:A,borderRadius:2,transition:'width 0.4s'}}/>
          </div>
          <button onClick={()=>setShowList(true)} style={{fontSize:12,fontWeight:700,color:'#9CA3AF',whiteSpace:'nowrap',background:'#1A1A1A',border:'1px solid #2A2A2A',borderRadius:8,padding:'6px 10px',cursor:'pointer',fontFamily:'inherit'}}>{ei+1} / {exs.length} &#9776;</button>
        </div>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:A,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:4}}>{cur.type}</div>
            <div style={{fontSize:22,fontWeight:800,lineHeight:1.2,marginBottom:4}}>{cur.name}</div>
            {cur.type==='Plyo'?<>
              <div style={{fontSize:13,color:'#555'}}>{cur.sets} sets &bull; {cur.reps} reps &bull; {cur.rest}s rest</div>
              {cur.cue&&<div style={{fontSize:12,color:'#444',marginTop:3}}>{cur.cue}</div>}
            </>:cur.type==='Distance'?<>
              <div style={{fontSize:13,color:'#555'}}>{cur.sets} sets &bull; {cur.metres} metres &bull; {cur.rest}s rest</div>
              {cur.cue&&<div style={{fontSize:12,color:'#444',marginTop:3}}>{cur.cue}</div>}
              {lEx&&lEx.sets&&lEx.sets.some(s=>s.t!=null)&&<div style={{fontSize:12,color:'#444',marginTop:3}}>Fastest last time: <span style={{color:'#888',fontWeight:600}}>{fmtTime(Math.min(...lEx.sets.filter(s=>s.t!=null).map(s=>s.t)))}</span></div>}
            </>:cur.type==='Interval'?<>
              <div style={{fontSize:13,color:'#555'}}>{cur.easy?fmtTime(cur.workS)+' easy pace':cur.sets+' sets \u2022 '+fmtTime(cur.workS)+' hard \u2022 '+fmtTime(cur.rest)+' easy'}</div>
              {cur.cue&&<div style={{fontSize:12,color:'#444',marginTop:3}}>{cur.cue}</div>}
              {cur.pb!=null&&<div style={{fontSize:12,color:'#444',marginTop:3}}>Previous best: <span style={{color:'#888',fontWeight:600}}>{cur.pb}m</span></div>}
            </>:<>
              <div style={{fontSize:13,color:'#555'}}>{cur.sets} sets &bull; {cur.rLo}&ndash;{cur.rHi} reps</div>
              {cur.pctOf&&cur.pct!=null&&(oneRM&&oneRM[cur.pctOf]?
                <div style={{fontSize:12,color:A,fontWeight:600,marginTop:3}}>{cur.pct}% of {cur.pctOf} 1RM &bull; target &asymp;{toDisp(roundPlate(oneRM[cur.pctOf]*cur.pct/100),unit)}{unit}</div>
                :<div style={{fontSize:12,color:'#444',marginTop:3}}>{cur.pct}% of {cur.pctOf} 1RM &mdash; test your max in Week 1 first</div>)}
              {cur.pb!=null&&<div style={{fontSize:12,color:'#444',marginTop:3}}>Previous best: <span style={{color:'#888',fontWeight:600}}>{toDisp(cur.pb,unit)}{unit}</span></div>}
              {lEx&&lEx.sets&&lEx.sets.some(s=>s.reps>=cur.rHi)&&<div style={{fontSize:12,color:A,fontWeight:600,marginTop:4}}>&#8593; You maxed reps last time — add weight today</div>}
            </>}
          </div>
          {(cur.type!=='Plyo'&&cur.type!=='Distance'||cur.alts)&&(cur.name!==cur.base||(ALT[cur.base]&&ALT[cur.base].length>0))&&<button onClick={()=>setShowSwap(true)}
            style={{background:'#1A1A1A',border:'1px solid #2A2A2A',borderRadius:8,color:'#666',fontSize:12,padding:'7px 10px',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
            &#8644; Swap
          </button>}
        </div>
        {/* Banners */}
        {pr&&<div style={{display:'flex',alignItems:'center',gap:8,background:'rgba(125,211,252,0.15)',border:'1px solid rgba(125,211,252,0.4)',borderRadius:8,padding:'8px 12px',marginTop:10}}>
          <span>&#127942;</span><div style={{flex:1,fontSize:13,fontWeight:700,color:'#7DD3FC'}}>New PR &mdash; {pr.metres!=null?pr.metres+'m':toDisp(pr.kg,unit)+unit} on {pr.name}!</div>
          <button onClick={()=>setPr(null)} style={{background:'transparent',border:'none',color:'#555',fontSize:16,cursor:'pointer',padding:0}}>&#10005;</button>
        </div>}

      </div>

      {/* Body */}
      <div style={{flex:1,overflowY:'scroll',WebkitOverflowScrolling:'touch',padding:'16px 16px 8px'}}>
        {/* Completed sets log */}
        {cur.logged.length>0&&<div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Completed &mdash; tap a set to edit</div>
          {cur.logged.map((s,i)=><div key={i} onClick={()=>openEdit(i)} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'rgba(125,211,252,0.08)',border:'1px solid rgba(125,211,252,0.2)',borderRadius:8,marginBottom:6}}>
            <span style={{fontSize:16,color:G}}>&#10003;</span>
            <div style={{flex:1,fontSize:14,color:'#888'}}>Set {i+1}</div>
            {cur.type!=='Plyo'&&cur.type!=='Distance'&&cur.type!=='Interval'&&<div style={{fontSize:15,fontWeight:700,color:'#ccc'}}>{s.w}{unit}</div>}
            <div style={{fontSize:15,fontWeight:700,color:'#ccc'}}>{cur.type==='Distance'||cur.type==='Interval'?s.r+' metres':s.r+' reps'}</div>
            {cur.type==='Distance'&&s.t!=null&&<div style={{display:'flex',alignItems:'center',gap:4}}>
              <span style={{fontSize:13,color:'#888',fontVariantNumeric:'tabular-nums'}}>{fmtTime(s.t)}</span>
              {lEx&&lEx.sets&&lEx.sets[i]&&lEx.sets[i].t!=null&&s.t<lEx.sets[i].t&&<span style={{fontSize:11,color:G,fontWeight:700}}>-{lEx.sets[i].t-s.t}s</span>}
              {lEx&&lEx.sets&&lEx.sets[i]&&lEx.sets[i].t!=null&&s.t>lEx.sets[i].t&&<span style={{fontSize:11,color:'#6B7280'}}>+{s.t-lEx.sets[i].t}s</span>}
            </div>}
                            <span style={{fontSize:13,color:'#555'}}>&#9998;</span>
          </div>)}
        </div>}

        {/* Last session reference */}
        {lEx&&lEx.sets&&lEx.sets.length>0&&!allSetsDone&&<div style={{background:'#111',borderLeft:'2px solid #2A2A2A',borderRadius:8,padding:'10px 14px',marginBottom:16}}>
          <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Last Session</div>
          {lEx.sets.map((s,i)=><div key={i} style={{display:'flex',gap:12,fontSize:13,color:'#555',lineHeight:1.8}}>
            <span>Set {i+1}</span><span>{cur.type==='Plyo'?(s.reps+' reps'):(cur.type==='Distance'||cur.type==='Interval')?(s.reps+' metres'+(cur.type==='Distance'&&s.t!=null?' \u2014 '+fmtTime(s.t):'')):(toDisp(s.kg,unit)+unit+' \u00d7 '+s.reps)}</span>
          </div>)}
        </div>}

        {/* Current set inputs — shown when sets remain */}
        {!allSetsDone&&<>
          <div style={{fontSize:11,color:A,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10}}>
            Set {setsDone+1} of {setsTotal}
          </div>
          {cur.type==='Plyo'?
            <div style={{background:'#111',border:'1px solid #2A2A2A',borderRadius:10,padding:'22px 16px',marginBottom:16,textAlign:'center'}}>
              <div style={{fontSize:36,fontWeight:800,color:'#fff'}}>{cur.reps}</div>
              <div style={{fontSize:13,color:'#555',fontWeight:600,marginTop:2}}>target reps</div>
            </div>
          :cur.type==='Distance'?
            <div style={{background:'#111',border:'1px solid #2A2A2A',borderRadius:10,padding:'22px 16px',marginBottom:16,textAlign:'center'}}>
              <div style={{fontSize:36,fontWeight:800,color:'#fff',fontVariantNumeric:'tabular-nums'}}>{resting?'\u2014':fmtTime(workSecs)}</div>
              <div style={{fontSize:13,color:'#555',fontWeight:600,marginTop:2}}>{resting?'resting \u2014 timer starts when you go':'timing this set \u2014 '+cur.metres+' metres'}</div>
            </div>
          :cur.type==='Interval'?
          <>
            <div style={{background:'#111',border:'1px solid #2A2A2A',borderRadius:10,padding:'22px 16px',marginBottom:16,textAlign:'center'}}>
              <div style={{fontSize:36,fontWeight:800,color:'#fff'}}>{fmtTime(cur.workS)}</div>
              <div style={{fontSize:13,color:'#555',fontWeight:600,marginTop:2}}>{cur.easy?'easy effort':'hard effort'} — log metres covered after</div>
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:'#555',fontWeight:600,marginBottom:6,textAlign:'center'}}>Metres covered</div>
              <input value={cur.curR} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,curR:e.target.value}))}
                type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" placeholder="0"
                style={{width:'100%',height:56,background:'#111',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:22,fontWeight:700,textAlign:'center',outline:'none'}}/>
            </div>
          </>
          :
          <div style={{display:'grid',gridTemplateColumns:'1.7fr 1fr',gap:10,marginBottom:16}}>
            {/* Weight - type it, or use -/+ (2.5kg / 5lb steps) */}
            <div>
              <div style={{fontSize:11,color:'#555',fontWeight:600,marginBottom:6,textAlign:'center'}}>{unit==='kg'?'Kg':'Lbs'}</div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>stepW(-1)} aria-label="Decrease weight" style={stepBtn}>&minus;</button>
                <input value={cur.curW} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,curW:e.target.value}))}
                  type="text" inputMode="decimal" pattern="[0-9.]*" autoComplete="off" placeholder="0"
                  style={{flex:1,minWidth:0,width:'100%',height:56,background:'#111',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:22,fontWeight:700,textAlign:'center',outline:'none'}}/>
                <button onClick={()=>stepW(1)} aria-label="Increase weight" style={stepBtn}>+</button>
              </div>
            </div>
            {/* Reps */}
            <div>
              <div style={{fontSize:11,color:'#555',fontWeight:600,marginBottom:6,textAlign:'center'}}>Reps</div>
              <input value={cur.curR} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,curR:e.target.value}))}
                type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" placeholder="0"
                style={{width:'100%',height:56,background:'#111',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:22,fontWeight:700,textAlign:'center',outline:'none'}}/>
            </div>
          </div>}
        </>}

        {/* Rest timer */}
        {secs>0&&<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#111',border:'1px solid #1E1E1E',borderRadius:10,padding:'12px 16px',marginBottom:12}}>
          <div>
            <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>Rest</div>
            <div style={{fontSize:26,fontWeight:800,color:A,fontVariantNumeric:'tabular-nums'}}>{fmtTime(secs)}</div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>addRest(30)} style={{background:'#1A1A1A',border:'1px solid #2A2A2A',borderRadius:8,color:'#9CA3AF',fontSize:13,padding:'8px 12px',cursor:'pointer',fontFamily:'inherit'}}>+30s</button>
            <button onClick={stopRest} style={{background:'#1A1A1A',border:'1px solid #2A2A2A',borderRadius:8,color:'#555',fontSize:13,padding:'8px 14px',cursor:'pointer',fontFamily:'inherit'}}>Skip</button>
          </div>
        </div>}

        {/* Notes (shown after all sets done) */}
        {allSetsDone&&<>
          {cur.pn&&<div style={{background:'#111',borderLeft:'2px solid #2A2A2A',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
            <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',marginBottom:4}}>Last Notes</div>
            <div style={{fontSize:13,color:'#555'}}>{cur.pn}</div>
          </div>}
          <textarea value={cur.notes} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,notes:e.target.value}))}
            placeholder="Notes for this exercise..."
            style={{width:'100%',height:52,background:'#111',border:'1px solid #1E1E1E',borderRadius:10,color:'#fff',fontSize:13,padding:'8px 12px',fontFamily:'inherit',lineHeight:1.4,outline:'none',marginBottom:8}}/>
        </>}
      </div>

      {/* Footer */}
      <div style={{background:'#0F0F0F',borderTop:'1px solid #1E1E1E',padding:'12px 16px 32px',display:'flex',flexDirection:'column',gap:10,flexShrink:0}}>
        {/* Primary action */}
        <button onClick={actionFn} style={{width:'100%',height:54,borderRadius:14,border:'none',cursor:'pointer',fontSize:16,fontWeight:800,color:'#fff',fontFamily:'inherit',...actionStyle}}>
          {actionLabel}
        </button>
        {/* Skip for now - e.g. machine is busy */}
        {!allSetsDone&&nextIdx!==-1&&<button onClick={skipExercise}
          style={{width:'100%',height:44,borderRadius:12,border:'1px solid #2A2A2A',background:'#111',color:'#9CA3AF',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
          Skip for now &mdash; come back later &#8635;
        </button>}
        {/* Cancel workout */}
        <button onClick={()=>setShowCancel(true)}
          style={{width:'100%',height:44,borderRadius:12,border:'1px solid #1E1E1E',background:'transparent',color:'#444',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
          Cancel Workout
        </button>
      </div>

      {/* Edit a logged set */}
      {editIdx!==null&&cur.logged[editIdx]&&<>
        <div onClick={()=>setEditIdx(null)} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)',zIndex:12}}/>
        <div style={{position:'absolute',left:0,right:0,bottom:0,background:'#111',borderRadius:'20px 20px 0 0',zIndex:13,padding:'18px 20px 34px'}}>
          <div style={{fontSize:16,fontWeight:800}}>Edit Set {editIdx+1}</div>
          <div style={{fontSize:12,color:'#6B7280',marginTop:2,marginBottom:14}}>{cur.name}</div>
          <div style={{display:'flex',gap:10}}>
            {cur.type==='Distance'?edField('Time (m:ss)','t','text'):<>
              {isRepType(cur)&&edField(unit==='kg'?'Kg':'Lbs','w','decimal')}
              {edField(cur.type==='Interval'?'Metres':'Reps','r','numeric')}
            </>}
          </div>
          <div style={{display:'flex',gap:10,marginTop:16}}>
            <button onClick={deleteSet} style={{flex:1,height:48,borderRadius:12,border:'1px solid '+R,background:'transparent',color:R,fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Delete set</button>
            <button onClick={saveEdit} style={{flex:2,height:48,borderRadius:12,border:'none',background:'linear-gradient(135deg,#0C4A6E,'+A+')',color:'#fff',fontSize:15,fontWeight:800,cursor:'pointer',fontFamily:'inherit'}}>Save</button>
          </div>
          <button onClick={()=>setEditIdx(null)} style={{width:'100%',height:40,marginTop:8,borderRadius:10,border:'none',background:'transparent',color:'#6B7280',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
        </div>
      </>}

      {/* Exercise list - jump to any exercise */}
      {showList&&<>
        <div onClick={()=>setShowList(false)} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)',zIndex:10}}/>
        <div style={{position:'absolute',left:0,right:0,bottom:0,maxHeight:'75%',background:'#111',borderRadius:'20px 20px 0 0',zIndex:11,display:'flex',flexDirection:'column'}}>
          <div onClick={()=>setShowList(false)} style={{display:'flex',justifyContent:'center',padding:'10px 0 6px',cursor:'pointer'}}>
            <div style={{width:36,height:3,borderRadius:2,background:'#2A2A2A'}}/>
          </div>
          <div style={{padding:'4px 20px 12px',borderBottom:'1px solid #1E1E1E'}}>
            <div style={{fontSize:15,fontWeight:800}}>Exercises</div>
            <div style={{fontSize:12,color:'#666',marginTop:2}}>{doneCount} of {exs.length} done &bull; tap any exercise to jump to it</div>
          </div>
          <div style={{overflowY:'scroll',WebkitOverflowScrolling:'touch',padding:'8px 20px 28px',display:'flex',flexDirection:'column',gap:7}}>
            {exs.map((x,j)=>{
              const isCur=j===ei,done=x.logged.length>=x.sets,started=x.logged.length>0;
              const status=done?'\u2713 Done':isCur?'Current':x.skipped?'Skipped \u2014 '+x.logged.length+'/'+x.sets+' sets':started?x.logged.length+'/'+x.sets+' sets':'Not started';
              const col=done?'#10B981':isCur?A:x.skipped?'#F59E0B':'#6B7280';
              return<button key={j} onClick={()=>isCur?setShowList(false):goTo(j)}
                style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderRadius:10,cursor:'pointer',textAlign:'left',fontFamily:'inherit',
                  background:isCur?'rgba(56,189,248,0.1)':'#1A1A1A',border:'1px solid '+(isCur?A:'#2A2A2A'),color:'#fff'}}>
                <div style={{fontSize:12,fontWeight:800,color:'#555',width:18}}>{j+1}</div>
                <div style={{flex:1,fontSize:14,fontWeight:600,opacity:done?0.6:1}}>{x.name}</div>
                <div style={{fontSize:11,fontWeight:700,color:col,whiteSpace:'nowrap'}}>{status}</div>
              </button>;
            })}
            {loggedSets>0&&!isLastEx&&<button onClick={finish}
              style={{marginTop:8,padding:12,borderRadius:10,border:'1px dashed #2A2A2A',background:'transparent',color:'#9CA3AF',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
              Finish workout now (unfinished exercises save what you logged)
            </button>}
          </div>
        </div>
      </>}

      {/* Cancel confirm dialog */}
      {showCancel&&<>
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.8)',zIndex:10}}/>
        <div style={{position:'absolute',left:20,right:20,top:'50%',transform:'translateY(-50%)',background:'#111',border:'1px solid #2A2A2A',borderRadius:16,padding:22,zIndex:11}}>
          <div style={{fontSize:17,fontWeight:800,marginBottom:6}}>Cancel Workout?</div>
          <div style={{fontSize:14,color:'#555',lineHeight:1.5,marginBottom:18}}>Your progress won't be saved.</div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={()=>setShowCancel(false)} style={{flex:1,height:46,borderRadius:10,border:'1px solid #2A2A2A',background:'transparent',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Keep Going</button>
            <button onClick={onExit} style={{flex:1,height:46,borderRadius:10,border:'none',background:'#1E1E1E',color:'#666',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
          </div>
        </div>
      </>}

      {/* Swap sheet */}
      {showSwap&&<>
        <div onClick={()=>setShowSwap(false)} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)',zIndex:10}}/>
        <div style={{position:'absolute',left:0,right:0,bottom:0,maxHeight:'70%',background:'#111',borderRadius:'20px 20px 0 0',zIndex:11,display:'flex',flexDirection:'column'}}>
          <div onClick={()=>setShowSwap(false)} style={{display:'flex',justifyContent:'center',padding:'10px 0 6px',cursor:'pointer'}}>
            <div style={{width:36,height:3,borderRadius:2,background:'#2A2A2A'}}/>
          </div>
          <div style={{padding:'4px 20px 12px',borderBottom:'1px solid #1E1E1E'}}>
            <div style={{fontSize:15,fontWeight:800}}>Swap Exercise</div>
            <div style={{fontSize:12,color:'#444',marginTop:2}}>Saves for future sessions</div>
          </div>
          <div style={{overflowY:'scroll',WebkitOverflowScrolling:'touch',padding:'8px 20px 28px',display:'flex',flexDirection:'column',gap:7}}>
            {(ALT[cur.base]||[]).map((alt,j)=>(
              <button key={j} onClick={()=>doSwap(alt)} style={{padding:'12px 14px',borderRadius:10,cursor:'pointer',fontSize:14,fontWeight:600,textAlign:'left',fontFamily:'inherit',
                background:cur.name===alt?'rgba(56,189,248,0.1)':'#1A1A1A',border:'1px solid '+(cur.name===alt?A:'#2A2A2A'),color:'#fff'}}>
                {alt}
              </button>
            ))}
            {cur.name!==cur.base&&<button onClick={()=>doSwap(cur.base)} style={{padding:12,borderRadius:10,border:'1px dashed #2A2A2A',background:'transparent',color:'#555',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
              Reset to {cur.base}
            </button>}
          </div>
        </div>
      </>}
    </div>
  );

  return ReactDOM.createPortal(workout, document.body);
}


function WorkoutComplete({entry,unit,prs,duration,toIncrease,onHome}){
  const vol=toDisp(entry.vol||0,unit);
  const sets=entry.exercises.reduce((a,e)=>a+e.sets.length,0);
  const isPlyo=!entry.vol;
  return(
    <FS col>
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',textAlign:'center'}}>
        <div style={{fontSize:56,marginBottom:6}}>&#127942;</div>
        <div style={{fontSize:24,fontWeight:800,marginBottom:4}}>Session Complete!</div>
        <div style={{fontSize:14,color:'#9CA3AF',marginBottom:22}}>{entry.label}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,width:'100%',marginBottom:16}}>
          {(isPlyo?[['&#9989;',String(sets),'Sets'],['&#128170;',String(entry.exercises.length),'Exercises'],['&#9201;',duration+' min','Duration']]:[['&#128230;',vol+' '+unit,'Volume'],['&#9989;',String(sets),'Sets'],['&#128170;',String(entry.exercises.length),'Exercises'],['&#9201;',duration+' min','Duration']]).map(([ic,v,l],i)=>(
            <div key={i} style={{background:'#161616',border:'1px solid '+B,borderRadius:12,padding:'12px 10px'}}>
              <div style={{fontSize:18,marginBottom:3}} dangerouslySetInnerHTML={{__html:ic}}/>
              <div style={{fontSize:16,fontWeight:800,color:A}}>{v}</div>
              <div style={{fontSize:10,color:'#6B7280',fontWeight:600,marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>
        {prs.length>0&&<div style={{width:'100%',background:'linear-gradient(135deg,#0C4A6E,#38BDF8)',borderRadius:12,padding:'12px 16px',marginBottom:12,textAlign:'left'}}>
          <div style={{fontSize:12,fontWeight:800,color:'#E0F2FE',marginBottom:4}}>&#127942; Personal Records</div>
          {prs.map((p,i)=><div key={i} style={{fontSize:12,color:'#E0F2FE',lineHeight:1.8}}>{p.name} &mdash; {p.weight}{unit}</div>)}
        </div>}
        {toIncrease&&toIncrease.length>0&&<div style={{width:'100%',background:'#161616',border:'1px solid '+B,borderRadius:12,padding:'12px 16px',marginBottom:16,textAlign:'left'}}>
          <div style={{fontSize:12,fontWeight:800,color:A,marginBottom:4}}>&#8593; Ready to increase next time</div>
          {toIncrease.map((n,i)=><div key={i} style={{fontSize:12,color:'#9CA3AF',lineHeight:1.8}}>{n}</div>)}
        </div>}
        <Btn onClick={onHome} ch="Back to Home" style={{width:'100%',height:50,borderRadius:12,background:'linear-gradient(135deg,#0C4A6E,'+A+')',color:'#000',fontSize:16,fontWeight:800}}/>
      </div>
    </FS>
  );
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function Progress({hist,unit,onUpdate}){
  const [open,setOpen]=useState(null);
  const [editing,setEditing]=useState(false);
  const [ed,setEd]=useState(null); // {hi,ej,sk,w,r,t}
  const [delConfirm,setDelConfirm]=useState(false);
  const [view,setView]=useState('charts');
  const [sel,setSel]=useState(null);
  const [range,setRange]=useState('all');
  const isRep=e=>e.type!=='Plyo'&&e.type!=='Distance'&&e.type!=='Interval';
  const fmtSet=(e,st)=>e.type==='Distance'?((st.reps||0)+'m'+(st.t!=null?' in '+fmtTime(st.t):'')):e.type==='Interval'?((st.reps||0)+'m'):e.type==='Plyo'?((st.reps||0)+' reps'):((st.kg?toDisp(st.kg,unit)+unit+' × '+st.reps:st.reps+' reps'));
  function toggle(i){setOpen(open===i?null:i);setEditing(false);setEd(null);setDelConfirm(false);}
  function openSet(hi,ej,sk){const st=hist[hi].exercises[ej].sets[sk];setEd({hi,ej,sk,w:st.kg?String(toDisp(st.kg,unit)):'',r:String(st.reps||''),t:st.t!=null?fmtTime(st.t):''});}
  function commit(hi,exercises){
    const ex=exercises.filter(e=>e.sets.length||e.notes);
    const vol=Math.round(ex.reduce((a,e)=>a+e.sets.reduce((b,st)=>b+(st.kg||0)*(st.reps||0),0),0));
    onUpdate(hi,{...hist[hi],exercises:ex,vol});setEd(null);
  }
  function saveSet(){
    const {hi,ej,sk}=ed;const e=hist[hi].exercises[ej];let ns={...e.sets[sk]};
    if(e.type==='Distance'){
      const m=/^(\d+):(\d{1,2})$/.exec(ed.t.trim());const t=m?(+m[1])*60+(+m[2]):parseFloat(ed.t);
      if(!(t>0))return;ns.t=Math.round(t);
    }else{
      const r=parseFloat(ed.r)||0;if(!r)return;ns.reps=r;
      if(isRep(e)){const w=parseFloat(ed.w)||0;ns.kg=w*(unit==='kg'?1:0.4536);}
    }
    commit(hi,hist[hi].exercises.map((x,j)=>j!==ej?x:{...x,sets:x.sets.map((y,k)=>k===sk?ns:y)}));
  }
  function deleteSet(){const {hi,ej,sk}=ed;commit(hi,hist[hi].exercises.map((x,j)=>j!==ej?x:{...x,sets:x.sets.filter((y,k)=>k!==sk)}));}
  function deleteSession(i){onUpdate(i,null);setOpen(null);setEditing(false);setDelConfirm(false);}
  const edEx=ed&&hist[ed.hi]&&hist[ed.hi].exercises[ed.ej];
  const field=(label,key,mode)=>(
    <div style={{flex:1}}>
      <div style={{fontSize:11,color:'#6B7280',fontWeight:600,marginBottom:6,textAlign:'center'}}>{label}</div>
      <input value={ed[key]} onChange={e=>setEd({...ed,[key]:e.target.value})} type="text" inputMode={mode} autoComplete="off"
        style={{width:'100%',height:52,background:'#0A0A0A',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:20,fontWeight:700,textAlign:'center',outline:'none'}}/>
    </div>);
  // ---- charts: one series per exercise (best set per session) ----
  const DAY=86400000;
  const series=(()=>{
    const raw={};
    hist.forEach(h=>{const d=new Date(h.date).getTime();(h.exercises||[]).forEach(e=>{
      if(!e.sets||!e.sets.length)return;const t=e.type||'Compound';
      const key=t==='Distance'?e.name+' — '+(e.sets[0].reps||0)+'m':e.name;
      (raw[key]=raw[key]||{type:t,rows:[]}).rows.push({d,sets:e.sets});
    });});
    const out={};
    Object.keys(raw).forEach(k=>{const {type,rows}=raw[k];let metric,pts;
      if(type==='Distance'){metric='time';pts=rows.map(r=>{const ts=r.sets.map(x=>x.t).filter(x=>x>0);return ts.length?{d:r.d,v:Math.min(...ts)}:null;});}
      else if(type==='Interval'){metric='metres';pts=rows.map(r=>{const m=r.sets.map(x=>x.reps||0).filter(x=>x>0);return m.length?{d:r.d,v:Math.max(...m)}:null;});}
      else{const hasKg=rows.some(r=>r.sets.some(x=>(x.kg||0)>0));metric=hasKg?'kg':'reps';
        pts=rows.map(r=>{const vals=r.sets.map(x=>hasKg?(x.kg||0):(x.reps||0)).filter(x=>x>0);return vals.length?{d:r.d,v:Math.max(...vals)}:null;});}
      pts=pts.filter(Boolean).sort((a,b)=>a.d-b.d);
      if(pts.length)out[k]={metric,pts};
    });
    return out;
  })();
  const names=Object.keys(series).sort((a,b)=>a.localeCompare(b));
  const curName=sel&&series[sel]?sel:(names.length?names.reduce((a,b)=>series[b].pts.length>series[a].pts.length?b:a):null);
  const cs=curName?series[curName]:null;
  const RANGES=[['all','All time'],['1y','Last year'],['3m','3 months'],['1m','Last month']];
  const span={all:Infinity,'1y':365*DAY,'3m':91*DAY,'1m':30*DAY}[range];
  const nowT=Date.now();
  const pts=cs?cs.pts.filter(p=>nowT-p.d<=span):[];
  const lowerBetter=!!cs&&cs.metric==='time';
  const fmtV=v=>!cs?'':cs.metric==='kg'?toDisp(v,unit)+unit:cs.metric==='time'?fmtTime(Math.round(v)):cs.metric==='metres'?Math.round(v)+'m':Math.round(v)+' reps';
  const metricLabel=!cs?'':cs.metric==='kg'?'Heaviest set each session':cs.metric==='time'?'Fastest time each session':cs.metric==='metres'?'Best round each session':'Most reps each session';
  function stepEx(d){if(!names.length)return;const i=names.indexOf(curName);setSel(names[(i+d+names.length)%names.length]);}
  const bestV=pts.length?(lowerBetter?Math.min(...pts.map(p=>p.v)):Math.max(...pts.map(p=>p.v))):null;
  const diff=pts.length>1?pts[pts.length-1].v-pts[0].v:0;
  const improved=lowerBetter?diff<0:diff>0;
  const diffTxt=pts.length<2?'—':cs.metric==='time'?((diff>0?'+':diff<0?'−':'')+fmtTime(Math.abs(Math.round(diff)))):((diff>0?'+':diff<0?'−':'')+(cs.metric==='kg'?toDisp(Math.abs(diff),unit)+unit:Math.round(Math.abs(diff))+(cs.metric==='metres'?'m':'')));
  const chart=(()=>{
    if(!pts.length)return null;
    const W=340,H=190,l=50,r=12,t=14,b=26;
    const xs=pts.map(p=>p.d),ys=pts.map(p=>p.v);
    let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0){x0-=DAY;x1+=DAY;}
    let y0=Math.min(...ys),y1=Math.max(...ys);if(y1===y0){y0=y0*0.9;y1=y1*1.1||1;}
    const pad=(y1-y0)*0.12;y0=Math.max(0,y0-pad);y1=y1+pad;
    const minSpan={kg:5,reps:4,time:10,metres:50}[cs.metric]||1;
    if(y1-y0<minSpan){const c=(y0+y1)/2;y0=Math.max(0,c-minSpan/2);y1=y0+minSpan;}
    const fmtTick=v=>cs.metric==='kg'?Math.round(toDisp(v,unit))+unit:fmtV(v);
    const X=d=>l+(d-x0)/(x1-x0)*(W-l-r),Y=v=>t+(1-(v-y0)/(y1-y0))*(H-t-b);
    const path=pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
    const area=path+' L'+X(pts[pts.length-1].d).toFixed(1)+' '+(H-b)+' L'+X(pts[0].d).toFixed(1)+' '+(H-b)+' Z';
    const dl=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return(<svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:'auto',display:'block'}}>
      <defs><linearGradient id="cfArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={A} stopOpacity="0.35"/><stop offset="100%" stopColor={A} stopOpacity="0"/></linearGradient></defs>
      {[y0,(y0+y1)/2,y1].map((v,i)=><g key={i}><line x1={l} x2={W-r} y1={Y(v)} y2={Y(v)} stroke="#293241" strokeDasharray="3 4"/><text x={l-6} y={Y(v)+4} fill="#6B7280" fontSize="10" textAnchor="end">{fmtTick(v)}</text></g>)}
      {pts.length>1&&<path d={area} fill="url(#cfArea)"/>}
      {pts.length>1&&<path d={path} fill="none" stroke={A} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
      {pts.map((p,i)=><circle key={i} cx={X(p.d)} cy={Y(p.v)} r={p.v===bestV?5:3.5} fill={p.v===bestV?'#FBBF24':A} stroke="#0A0A0A" strokeWidth="1.5"/>)}
      <text x={l} y={H-6} fill="#6B7280" fontSize="10">{dl(pts[0].d)}</text>
      {pts.length>1&&<text x={W-r} y={H-6} fill="#6B7280" fontSize="10" textAnchor="end">{dl(pts[pts.length-1].d)}</text>}
    </svg>);
  })();
  const navBtn={width:44,height:44,flexShrink:0,borderRadius:10,background:S,border:'1px solid '+B,color:'#fff',fontSize:22,fontWeight:700,cursor:'pointer',fontFamily:'inherit',padding:0};
  const smallBtn={flex:1,height:40,borderRadius:10,border:'1px solid '+B,background:'#1E1E1E',color:'#E5E7EB',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'};
  return(
    <FS scroll>
      <div style={{padding:'60px 20px 20px'}}>
        <div style={{fontSize:22,fontWeight:800,marginBottom:12}}>Progress</div>
        <div style={{display:'flex',background:S,border:'1px solid '+B,borderRadius:12,padding:4,marginBottom:14}}>
          {[['charts','Charts'],['history','History']].map(([k,l])=><div key={k} onClick={()=>setView(k)}
            style={{flex:1,textAlign:'center',padding:10,borderRadius:9,fontSize:13,fontWeight:700,cursor:'pointer',background:view===k?A:'transparent',color:view===k?'#000':'#9CA3AF'}}>{l}</div>)}
        </div>
        {!hist.length&&<div style={{textAlign:'center',padding:'60px 0',color:'#6B7280',fontSize:14}}>No sessions yet. Finish a workout to start tracking.</div>}
        {view==='charts'&&hist.length>0&&(!names.length?<div style={{textAlign:'center',padding:'40px 0',color:'#6B7280',fontSize:14}}>No logged sets to chart yet.</div>:<>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
            <button onClick={()=>stepEx(-1)} aria-label="Previous exercise" style={navBtn}>&#8249;</button>
            <select value={curName} onChange={e=>setSel(e.target.value)}
              style={{flex:1,minWidth:0,height:44,borderRadius:10,background:S,border:'1px solid '+B,color:'#fff',fontSize:14,fontWeight:700,padding:'0 10px',fontFamily:'inherit'}}>
              {names.map(n=><option key={n} value={n}>{n}</option>)}
            </select>
            <button onClick={()=>stepEx(1)} aria-label="Next exercise" style={navBtn}>&#8250;</button>
          </div>
          <div style={{display:'flex',gap:6,marginBottom:12}}>
            {RANGES.map(([k,l])=><button key={k} onClick={()=>setRange(k)}
              style={{flex:1,height:34,borderRadius:9,border:'1px solid '+(range===k?A:B),background:range===k?'rgba(56,189,248,0.15)':'transparent',color:range===k?'#fff':'#9CA3AF',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit',padding:0}}>{l}</button>)}
          </div>
          <Card style={{marginBottom:10}} ch={<>
            <div style={{fontSize:11,color:'#6B7280',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>{metricLabel}</div>
            {pts.length?chart:<div style={{textAlign:'center',padding:'40px 0',color:'#6B7280',fontSize:13}}>No sessions in this period.</div>}
            {pts.length===1&&<div style={{fontSize:12,color:'#6B7280',textAlign:'center',marginTop:6}}>Log this exercise again to see a trend.</div>}
          </>}/>
          {pts.length>0&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}}>
            {[['Latest',fmtV(pts[pts.length-1].v),'#fff'],['Best',fmtV(bestV),'#FBBF24'],['Change',diffTxt,pts.length<2||diff===0?'#9CA3AF':improved?'#10B981':R]].map(([l,v,c])=>
              <div key={l} style={{background:S,border:'1px solid '+B,borderRadius:12,padding:'10px 6px',textAlign:'center'}}>
                <div style={{fontSize:15,fontWeight:800,color:c}}>{v}</div>
                <div style={{fontSize:10,color:'#6B7280',fontWeight:600,marginTop:2}}>{l}</div>
              </div>)}
          </div>}
          {pts.length>0&&<div style={{fontSize:11,color:'#6B7280',textAlign:'center'}}>{pts.length} session{pts.length===1?'':'s'} in this period &bull; {names.length} exercises tracked</div>}
        </>)}
        {view==='history'&&hist.length>0&&<div style={{fontSize:12,color:'#6B7280',marginBottom:12}}>Tap a session to see it, then Edit sets to fix anything logged wrong.</div>}
        {view==='history'&&hist.map((h,i)=><Card key={i} style={{marginBottom:10,cursor:'pointer'}} onClick={()=>toggle(i)} ch={<>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div><div style={{fontSize:14,fontWeight:700,marginBottom:2}}>{h.label}</div><div style={{fontSize:12,color:'#9CA3AF'}}>{fmtDate(h.date)}</div></div>
            <div style={{textAlign:'right'}}>{h.vol?<><div style={{fontSize:13,fontWeight:800,color:A}}>{toDisp(h.vol,unit)} {unit}</div><div style={{fontSize:10,color:'#6B7280'}}>volume</div></>:<><div style={{fontSize:13,fontWeight:800,color:A}}>{(h.exercises||[]).reduce((a,e)=>a+e.sets.length,0)}</div><div style={{fontSize:10,color:'#6B7280'}}>sets</div></>}</div>
          </div>
          {open===i&&h.exercises&&<div onClick={e=>e.stopPropagation()} style={{marginTop:10,paddingTop:10,borderTop:'1px solid '+B,display:'flex',flexDirection:'column',gap:8,cursor:'default'}}>
            {h.exercises.map((e,j)=><div key={j}>
              <div style={{fontSize:12,fontWeight:700,marginBottom:2}}>{e.name}</div>
              {editing?<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:4}}>
                {e.sets.map((st,k)=><button key={k} onClick={()=>openSet(i,j,k)} style={{padding:'7px 10px',borderRadius:8,background:'#1E1E1E',border:'1px solid '+A,color:'#E5E7EB',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>{'Set '+(k+1)+': '+fmtSet(e,st)} &#9998;</button>)}
              </div>
              :<div style={{fontSize:11,color:'#9CA3AF'}}>{e.sets.map((st,k)=>'Set '+(k+1)+': '+fmtSet(e,st)).join(' · ')}</div>}
              {e.notes&&<div style={{fontSize:11,color:'#6B7280',marginTop:2,fontStyle:'italic'}}>&#128221; {e.notes}</div>}
            </div>)}
            <div style={{display:'flex',gap:8,marginTop:6}}>
              <button onClick={()=>{setEditing(!editing);setDelConfirm(false);}} style={{...smallBtn,color:editing?'#000':'#E5E7EB',background:editing?A:'#1E1E1E'}}>{editing?'Done':'Edit sets'}</button>
              {editing&&<button onClick={()=>delConfirm?deleteSession(i):setDelConfirm(true)} style={{...smallBtn,border:'1px solid '+R,background:'transparent',color:R}}>{delConfirm?'Tap again to delete':'Delete session'}</button>}
            </div>
          </div>}
        </>}/>)}
      </div>
      {ed&&edEx&&<>
        <div onClick={()=>setEd(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:10000}}/>
        <div style={{position:'fixed',left:0,right:0,bottom:0,background:'#111',borderRadius:'20px 20px 0 0',zIndex:10001,padding:'18px 20px 34px'}}>
          <div style={{fontSize:16,fontWeight:800}}>Edit Set {ed.sk+1}</div>
          <div style={{fontSize:12,color:'#6B7280',marginTop:2,marginBottom:14}}>{edEx.name} &bull; {hist[ed.hi].label}</div>
          <div style={{display:'flex',gap:10}}>
            {edEx.type==='Distance'?field('Time (m:ss)','t','text'):<>
              {isRep(edEx)&&field(unit==='kg'?'Kg':'Lbs','w','decimal')}
              {field(edEx.type==='Interval'?'Metres':'Reps','r','numeric')}
            </>}
          </div>
          <div style={{display:'flex',gap:10,marginTop:16}}>
            <button onClick={deleteSet} style={{flex:1,height:48,borderRadius:12,border:'1px solid '+R,background:'transparent',color:R,fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Delete set</button>
            <button onClick={saveSet} style={{flex:2,height:48,borderRadius:12,border:'none',background:'linear-gradient(135deg,#0C4A6E,'+A+')',color:'#fff',fontSize:15,fontWeight:800,cursor:'pointer',fontFamily:'inherit'}}>Save</button>
          </div>
          <button onClick={()=>setEd(null)} style={{width:'100%',height:40,marginTop:8,borderRadius:10,border:'none',background:'transparent',color:'#6B7280',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
        </div>
      </>}
    </FS>
  );
}

// ── NUTRITION ─────────────────────────────────────────────────────────────────
function Nutrition({saved,savedRes,onSave,onSaveRes}){
  const DEF={gender:'male',age:'',cm:'',ft:'',inch:'',kg:'',lbs:'',job:'desk',freq:'3-4',goal:'bulk'};
  const [n,setN]=useState({...DEF,...(saved||{})});
  const [res,setRes]=useState(savedRes||null);
  const [errs,setErrs]=useState({});
  const upd=(f,v)=>setN(p=>({...p,[f]:v}));
  const updS=(patch)=>{const nx={...n,...patch};setN(nx);onSave(nx);};
  function calc(){
    onSave(n);const er={};
    const age=parseFloat(n.age)||0;if(!age)er.age='Enter age';
    const cm=parseFloat(n.cm)||((parseFloat(n.ft)||0)*30.48+(parseFloat(n.inch)||0)*2.54);if(!cm)er.h='Enter height';
    const kg=parseFloat(n.kg)||((parseFloat(n.lbs)||0)/2.20462);if(!kg)er.w='Enter weight';
    if(Object.keys(er).length){setErrs(er);return;}
    setErrs({});
    const m=n.gender==='male';
    const bmr=m?(10*kg+6.25*cm-5*age+5):(10*kg+6.25*cm-5*age-161);
    const jobBase=(JOB_ACTS.find(j=>j.v===n.job)||JOB_ACTS[0]).base;
    const trainAdd=(TRAIN_FREQS.find(t=>t.v===n.freq)||TRAIN_FREQS[1]).add;
    const tdee=bmr*(jobBase+trainAdd);
    const lbsW=kg*2.20462;
    // Bulk: Iraki et al. (2019) Sports 7:154 — off-season guidance is expressed as
    // a percentage of maintenance (10-20% above TDEE for novice/intermediate lifters,
    // 5-10% for advanced), which scales fairly with individual size rather than
    // handing everyone the same fixed kcal number.
    const pMin=Math.round(lbsW*0.73),pTgt=Math.round(lbsW*0.82);
    const fMin=Math.round(m?kg:kg*0.7),fTgt=Math.round(m?kg*1.2:kg*0.9);
    const mLo=tdee*1.10,mHi=tdee*1.20;
    // Cut: Trexler, Smith-Ryan & Norton (2014) J Int Soc Sports Nutr 11:7 —
    // percentage-based deficits scale fairly with individual maintenance calories and,
    // combined with a moderate size, better preserve lean mass and limit metabolic adaptation
    // than a large fixed kcal cut. 10-20% below TDEE is a widely used evidence-aligned range.
    // Protein needs rise during a cut (Helms, Aragon & Fitschen 2014): 2.3-3.1 g/kg lean mass,
    // approximated as ~0.9-1.0 g/lb total bodyweight when lean mass isn't measured directly.
    const cutLo=tdee*0.80,cutHi=tdee*0.90;
    const pMinCut=Math.round(lbsW*0.9),pTgtCut=Math.round(lbsW*1.0);
    const cutCLo=Math.max(0,Math.round((cutLo-fTgt*9-pTgtCut*4)/4));
    const cutCHi=Math.max(0,Math.round((cutHi-fMin*9-pMinCut*4)/4));
    const r={bmr:Math.round(bmr),tdee:Math.round(tdee),mLo:Math.round(mLo),mHi:Math.round(mHi),pMin,pTgt,fMin,fTgt,cLo:Math.round((mLo-fMin*9-pMin*4)/4),cHi:Math.round((mHi-fTgt*9-pTgt*4)/4),
      cutLo:Math.round(cutLo),cutHi:Math.round(cutHi),pMinCut,pTgtCut,cutCLo,cutCHi,m};
    setRes(r);onSaveRes(r);
  }
  const Pill=({a,on,l})=><Btn on={on} onClick={on} ch={l} style={{flex:1,height:44,borderRadius:10,background:a?A:'transparent',color:a?'#000':'#9CA3AF',border:'1px solid '+B,fontSize:14,fontWeight:700}}/>;
  const iSty=(err)=>({width:'100%',height:48,background:'#0A0A0A',border:'1px solid '+(err?R:B),borderRadius:8,color:'#fff',fontSize:16,padding:'0 12px',outline:'none'});
  const FL=({c})=><div style={{fontSize:11,color:'#9CA3AF',fontWeight:600,marginBottom:4}}>{c}</div>;
  const RC=({val,lbl,sub,color,hi})=><Card style={{border:hi?'2px solid '+A:'1px solid '+B,marginBottom:10}} ch={<><div style={{fontSize:18,fontWeight:800,color:color||'#fff'}}>{val}</div><div style={{fontSize:10,color:'#6B7280',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.04em',margin:'2px 0 2px'}}>{lbl}</div><div style={{fontSize:11,color:'#9CA3AF'}}>{sub}</div></>}/>;
  const isBulk=n.goal!=='cut';
  return(

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [ready,setReady]=useState(false);
  const [authUser,setAuthUser]=useState(undefined); // undefined=checking, null=signed out, object=signed in
  const [cloudReady,setCloudReady]=useState(false); // whether we've attempted the Supabase fetch for this user
  const [access,setAccess]=useState(undefined); // undefined=checking, true=paid, false=no payment found, 'error'=could not verify
  const [recovery,setRecovery]=useState(false); // true when user has arrived via a password-reset link
  const [ob,setOb]=useState(false);
  const [name,setName]=useState('');
  const [unit,setUnit]=useState('kg');
  const [planId,setPlanId]=useState('ppl');
  const [hist,setHist]=useState([]);
  const [streak,setStreak]=useState(DEF_ST);
  const [oneRM,setOneRM]=useState(DEF_PR);
  const [cel,setCel]=useState([]);
  const [swaps,setSwaps]=useState({});
  const [nutrIn,setNutrIn]=useState(null);
  const [nutrRes,setNutrRes]=useState(null);
  const [tab,setTab]=useState('home');
  const [screen,setScreen]=useState('home');
  const [aS,setAS]=useState(null);  // active session {sess, planId}
  const [comp,setComp]=useState(null);
  const [mile,setMile]=useState(null);
  const [claimEmail,setClaimEmail]=useState(undefined); // undefined=checking URL, null=not applicable, string=verified paid email awaiting account creation
  const [claimMsg,setClaimMsg]=useState(null);

  // Check for a return from Stripe Checkout and verify payment server-side before allowing account creation
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const sessionId=params.get('session_id');
    if(params.get('checkout')==='success'&&sessionId){
      (async()=>{
        try{
          const res=await fetch('/api/verify-checkout-session?session_id='+encodeURIComponent(sessionId));
          const data=await res.json();
          if(data.paid&&data.email){setClaimEmail(data.email);}
          else{setClaimEmail(null);}
        }catch(e){setClaimEmail(null);}
        window.history.replaceState({},'',window.location.pathname);
      })();
    }else{
      setClaimEmail(null);
    }
  },[]);


  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setAuthUser(data.session?data.session.user:null));
    const {data:sub}=sb.auth.onAuthStateChange((event,session)=>{
      if(event==='PASSWORD_RECOVERY')setRecovery(true);
      setAuthUser(session?session.user:null);
    });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  // Ask the server whether this signed-in account has paid (Stripe is the source of truth)
  function checkAccess(){
    setAccess(undefined);
    sb.auth.getSession().then(({data})=>{
      const token=data.session&&data.session.access_token;
      if(!token){setAccess('error');return;}
      return fetch('/api/check-access',{method:'POST',headers:{Authorization:'Bearer '+token}})
        .then(r=>r.json().then(j=>({ok:r.ok,j})))
        .then(({ok,j})=>setAccess(ok&&j&&typeof j.access==='boolean'?j.access:'error'));
    }).catch(()=>setAccess('error'));
  }
  useEffect(()=>{
    if(!authUser){setAccess(undefined);return;}
    checkAccess();
  },[authUser&&authUser.id]);

  useEffect(()=>{
    setOb(ld(K.ob,false));setName(ld(K.nm,''));setUnit(ld(K.ut,'kg'));setPlanId(ld(K.pl,'ppl'));
    const rh=ld(K.hi,[]);setHist(Array.isArray(rh)?rh.map(h=>({...h,exercises:Array.isArray(h.exercises)?h.exercises.map(e=>({...e,sets:Array.isArray(e.sets)?e.sets:[],notes:e.notes||''})):[]})):[]);
    const rs=ld(K.st,DEF_ST);setStreak({...DEF_ST,...rs,dates:Array.isArray(rs.dates)?rs.dates:[],total:rs.total||0});
    setCel(ld(K.cl,[]));setSwaps(ld(K.sw,{})||{});setNutrIn(ld(K.nu,null));setNutrRes(ld(K.nr,null));
    const rp=ld(K.pr,DEF_PR);setOneRM({...DEF_PR,...rp});
    setTimeout(()=>setReady(true),300);
  },[]);

  // Pull this user's saved state from Supabase once we know who they are
  useEffect(()=>{
    if(!authUser){setCloudReady(false);return;}
    let cancelled=false;
    (async()=>{
      const {data,error}=await sb.from('app_state').select('data').eq('user_id',authUser.id).maybeSingle();
      if(cancelled)return;
      if(!error&&data&&data.data){
        const d=data.data;
        setOb(d.ob??false);setName(d.nm??'');setUnit(d.ut??'kg');setPlanId(d.pl??'ppl');
        setHist(Array.isArray(d.hi)?d.hi:[]);setStreak(d.st?{...DEF_ST,...d.st}:DEF_ST);
        setCel(Array.isArray(d.cl)?d.cl:[]);setSwaps(d.sw||{});setNutrIn(d.nu??null);setNutrRes(d.nr??null);
        setOneRM(d.pr?{...DEF_PR,...d.pr}:DEF_PR);
        sv(K.ob,d.ob??false);sv(K.nm,d.nm??'');sv(K.ut,d.ut??'kg');sv(K.pl,d.pl??'ppl');
        sv(K.hi,d.hi??[]);sv(K.st,d.st??DEF_ST);sv(K.cl,d.cl??[]);sv(K.sw,d.sw??{});sv(K.nu,d.nu??null);sv(K.nr,d.nr??null);sv(K.pr,d.pr??DEF_PR);
      }
      if(!cancelled)setCloudReady(true);
    })();
    return ()=>{cancelled=true;};
  },[authUser]);

  // Push this user's state to Supabase whenever it changes (debounced, batched into one row)
  useEffect(()=>{
    if(!authUser||!cloudReady||access!==true)return;
    const payload={ob,nm:name,ut:unit,pl:planId,hi:hist,st:streak,cl:cel,sw:swaps,nu:nutrIn,nr:nutrRes,pr:oneRM};
    const t=setTimeout(()=>{
      sb.from('app_state').upsert({user_id:authUser.id,data:payload,updated_at:new Date().toISOString()}).then(({error})=>{if(error)console.error('cloud sync failed',error);});
    },600);
    return ()=>clearTimeout(t);
  },[authUser,cloudReady,access,ob,name,unit,planId,hist,streak,cel,swaps,nutrIn,nutrRes,oneRM]);

  function savePrefs({name:nm,unit:u,planId:p}){setName(nm);setUnit(u);setPlanId(p);sv(K.nm,nm);sv(K.ut,u);sv(K.pl,p);}
  function saveSwap(key,val){const ns=val!=null?{...swaps,[key]:val}:(()=>{const c={...swaps};delete c[key];return c;})();setSwaps(ns);sv(K.sw,ns);}
  function setPR(liftKey,kg){const np={...oneRM,[liftKey]:kg};setOneRM(np);sv(K.pr,np);}
  function savePRFromSettings(liftKey,val){const n=parseFloat(val);const kg=(val===''||isNaN(n)||n<=0)?null:(unit==='kg'?n:n*0.4536);setPR(liftKey,kg);}

  function startSess(sess,pid){setAS({sess,planId:pid||planId});setScreen('session');}

  function finishWorkout(entry,prs,dur,toIncrease){
    const nh=[entry,...hist];setHist(nh);sv(K.hi,nh);
    const today=new Date().toISOString().slice(0,10);
    const st=streak;let cur=st.cur;
    if(!st.lastDate)cur=1;else{const gap=Math.round((new Date(today)-new Date(st.lastDate))/86400000);cur=gap===0?(st.cur||1):gap<=2?st.cur+1:1;}
    const ns={cur,best:Math.max(st.best,cur),lastDate:today,total:st.total+1,dates:st.dates.includes(today)?st.dates:[...st.dates,today]};
    setStreak(ns);sv(K.st,ns);
    const MILES=[7,14,30];
    if(MILES.includes(cur)&&!cel.includes(cur)){const nc=[...cel,cur];setCel(nc);sv(K.cl,nc);setMile(cur);}
    setComp({entry,prs:prs||[],duration:dur||0,toIncrease:toIncrease||[]});setScreen('complete');setAS(null);
  }

  const showTab=!['session','workout','complete'].includes(screen);
  const TABS=[{id:'home',l:'Home',e:'\uD83C\uDFE0'},{id:'programmes',l:'Plans',e:'\uD83D\uDCCB'},{id:'progress',l:'Log',e:'\uD83D\uDCCA'},{id:'nutrition',l:'Nutrition',e:'\uD83D\uDD25'},{id:'settings',l:'Settings',e:'\u2699\uFE0F'}];

  if(!ready||authUser===undefined||claimEmail===undefined||(authUser&&!cloudReady&&!recovery)||(authUser&&!recovery&&access===undefined))return<div style={{position:'fixed',inset:0,background:'#0A0A0A',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{fontSize:18,fontWeight:800,color:A}}>CONSTANTINE FITNESS</div></div>;
  if(recovery)return<ResetPassword onDone={()=>setRecovery(false)}/>;
  if(claimEmail&&!authUser)return<ClaimAccess email={claimEmail} onDone={(msg)=>{setClaimEmail(null);setClaimMsg(msg);}}/>;
  if(!authUser)return<Auth initialMsg={claimMsg}/>;
  if(access!==true)return<Paywall email={authUser.email} status={access} onRecheck={checkAccess}/>;
  if(!ob)return<Onboarding onDone={({name:n,plan:p,unit:u})=>{setName(n);setPlanId(p);setUnit(u);setOb(true);sv(K.nm,n);sv(K.pl,p);sv(K.ut,u);sv(K.ob,true);}}/>;

  return(
    <>
      {/* Screen area — position:relative so child position:absolute fills it */}
      <div style={{flex:1,position:'relative',overflow:'hidden'}}>
        {screen==='home'&&<Home planId={planId} hist={hist} streak={streak} onStart={sess=>startSess(sess,planId)} onSettings={()=>setScreen('settings')}/>}
        {screen==='programmes'&&<Programmes planId={planId} onStart={(sess,pid)=>startSess(sess,pid)}/>}
        {screen==='session'&&aS&&<SessionOverview planId={aS.planId} sess={aS.sess} hist={hist} unit={unit} swaps={swaps} onSaveSwap={saveSwap} onBegin={()=>setScreen('workout')} onBack={()=>{setScreen(tab);setAS(null);}} oneRM={oneRM}/>}
        {screen==='progress'&&<Progress hist={hist} unit={unit} onUpdate={(i,en)=>{const nh=en?hist.map((h,j)=>j===i?en:h):hist.filter((h,j)=>j!==i);setHist(nh);sv(K.hi,nh);}}/>}
        {screen==='nutrition'&&<Nutrition saved={nutrIn} savedRes={nutrRes} onSave={v=>{setNutrIn(v);sv(K.nu,v);}} onSaveRes={v=>{setNutrRes(v);sv(K.nr,v);}}/>}
        {screen==='settings'&&<Settings name={name} unit={unit} planId={planId} onSave={savePrefs} email={authUser&&authUser.email} onSignOut={()=>sb.auth.signOut()}
          onReset={pid=>{const nh=hist.filter(h=>h.planId!==pid);setHist(nh);sv(K.hi,nh);setStreak(s=>({...s,cur:0}));if(pid==='pl'){setOneRM(DEF_PR);sv(K.pr,DEF_PR);}setScreen('home');setTab('home');}}
          onResetAll={()=>{Object.values(K).forEach(k=>{try{localStorage.removeItem(k);}catch{}});setOb(false);setName('');setUnit('kg');setPlanId('ppl');setHist([]);setStreak(DEF_ST);setCel([]);setSwaps({});setNutrIn(null);setNutrRes(null);setOneRM(DEF_PR);}}
          onClose={()=>setScreen(tab)} oneRM={oneRM} onSavePR={savePRFromSettings}/>}
        {screen==='complete'&&comp&&<WorkoutComplete entry={comp.entry} unit={unit} prs={comp.prs} duration={comp.duration} toIncrease={comp.toIncrease} onHome={()=>{setComp(null);setScreen('home');setTab('home');}}/>}
        {/* Workout — position:absolute same as all other working screens */}
        {screen==='workout'&&aS&&<ActiveWorkout planId={aS.planId} sess={aS.sess} hist={hist} unit={unit} swaps={swaps} onSaveSwap={saveSwap} onDone={finishWorkout} onExit={()=>{setScreen(tab);setAS(null);}} oneRM={oneRM} onSetPR={setPR}/>}
      </div>
      {/* Tab bar */}
      {showTab&&<div style={{display:'flex',borderTop:'1px solid '+B,background:'#0A0A0A',padding:'6px 4px 26px',flexShrink:0}}>
        {TABS.map(t=><div key={t.id} onClick={()=>{setTab(t.id);setScreen(t.id);}} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'4px 0',cursor:'pointer',minHeight:44,justifyContent:'center'}}>
          <div style={{fontSize:18}}>{t.e}</div>
          <div style={{fontSize:10,fontWeight:600,color:tab===t.id?A:'#6B7280'}}>{t.l}</div>
        </div>)}
      </div>}
      {mile&&<Milestone days={mile} onClose={()=>setMile(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
