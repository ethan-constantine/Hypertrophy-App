<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Constantine Fitness">
<title>Constantine Fitness</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0A0A;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#root{position:fixed;inset:0;display:flex;flex-direction:column}
button{cursor:pointer;border:none;background:transparent;color:inherit;font-family:inherit;-webkit-appearance:none}
input,textarea{font-family:inherit;outline:none;-webkit-appearance:none;border:none}
textarea{resize:none}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const A='#10B981',G='#34D399',R='#F87171',S='#141414',B='#252525';
const K={ob:'cf.ob',nm:'cf.nm',ut:'cf.ut',pl:'cf.pl',hi:'cf.hi',st:'cf.st',cl:'cf.cl',nu:'cf.nu',nr:'cf.nr',sw:'cf.sw'};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

// ── DATA ──────────────────────────────────────────────────────────────────────
const ALT={
  'Flat Barbell Bench Press':['Incline Barbell Press','Flat Dumbbell Press','Incline Dumbbell Press','Incline Smith Machine Press'],
  'Incline Dumbbell Press':['Incline Barbell Press','Flat Barbell Bench Press','Flat Dumbbell Press','Incline Smith Machine Press'],
  'Standing Overhead Press':['Seated Dumbbell Shoulder Press','Machine Shoulder Press','Smith Machine Overhead Press'],
  'Dumbbell Lateral Raise':['Cable Lateral Raise','Y Raise','Machine Lateral Raise'],
  'Cable Lateral Raise':['Dumbbell Lateral Raise','Y Raise','Machine Lateral Raise'],
  'Cable Overhead Tricep Extension':['Cable Pushdown','Cable Kickback','Skullcrusher','Single-Arm Dumbbell Overhead Extension'],
  'Cable Pushdown (Rope)':['Cable Overhead Tricep Extension','Cable Kickback','Skullcrusher','Single-Arm Dumbbell Overhead Extension'],
  'Skullcrusher':['Cable Overhead Tricep Extension','Cable Pushdown','Cable Kickback','Single-Arm Dumbbell Overhead Extension'],
  'Barbell Curl':['Cable Curl','Reverse Cable Curl','Hammer Curl','Bayesian Curl'],
  'Hammer Curl':['Cable Curl','Reverse Cable Curl','Barbell Curl','Bayesian Curl'],
  'Bent Over Barbell Row':['Chest-Supported Machine Row','Dumbbell Row','Seated Cable Row','T-Bar Row'],
  'V-Bar Lat Pulldown':['Pull Up','Close Grip Lat Pulldown','Close Grip Seated Row','Plate-Loaded Lat Pulldown Machine','Crossbody Cable Lat Pulldown'],
  'Wide-Grip Lat Pulldown':['Pull Up','Close Grip Lat Pulldown','Close Grip Seated Row','Plate-Loaded Lat Pulldown Machine'],
  'Barbell Shrug':['Dumbbell Shrug','Cable Shrug','Smith Machine Shrug'],
  'Face Pull':['Cable Rear Delt Fly','Dumbbell Reverse Fly','Band Face Pull'],
  'Reverse Pec Deck':['Dumbbell Reverse Fly','Cable Rear Delt Fly'],
  'Cable Chest Fly':['Dumbbell Pec Fly','Machine Fly','Pec Deck'],
  'Barbell Back Squat':['Front Squat','Leg Press','Hack Squat Machine','Smith Machine Squat'],
  'Romanian Deadlift':['Smith Machine RDL','Conventional Deadlift','Good Morning','Single-Leg Dumbbell RDL'],
  'Hip Thrust':['Smith Machine Hip Thrust','Single-Leg Hip Thrust','Glute Bridge','Cable Pull-Through'],
  'Leg Extension Machine':['Single-Leg Leg Extension','Plate-Loaded Leg Extension','Sissy Squat'],
  'Seated Leg Curl':['Lying Leg Curl','Single-Leg Lying Leg Curl','Standing Leg Curl','Nordic Curl'],
  'Lying Leg Curl Machine':['Seated Leg Curl','Single-Leg Lying Leg Curl','Standing Leg Curl','Nordic Curl'],
  'Cable Donkey Kick':['Machine Glute Kickback','Hip Thrust','Banded Glute Kickback'],
};

const ex=(n,s,lo,hi,t,r)=>({name:n,sets:s,rLo:lo,rHi:hi,type:t,rpe:r});
const PROGS={
  ppl:{id:'ppl',name:'Push / Pull / Legs',short:'PPL',freq:'6x / week',sessions:[
    {key:'push',label:'Push',exercises:[ex('Flat Barbell Bench Press',3,6,10,'Compound',8),ex('Incline Dumbbell Press',2,8,12,'Compound',8),ex('Standing Overhead Press',3,8,10,'Compound',8),ex('Dumbbell Lateral Raise',4,12,15,'Isolation',10),ex('Cable Overhead Tricep Extension',3,10,12,'Isolation',10),ex('Cable Pushdown (Rope)',2,12,15,'Isolation',10)]},
    {key:'pull',label:'Pull',exercises:[ex('Bent Over Barbell Row',3,6,10,'Compound',8),ex('V-Bar Lat Pulldown',3,8,12,'Compound',8),ex('Barbell Shrug',3,10,15,'Isolation',10),ex('Face Pull',3,12,15,'Isolation',10),ex('Reverse Pec Deck',2,12,15,'Isolation',10),ex('Barbell Curl',2,10,12,'Isolation',10)]},
    {key:'legs',label:'Legs',exercises:[ex('Barbell Back Squat',3,5,8,'Compound',8),ex('Romanian Deadlift',3,8,12,'Compound',8),ex('Hip Thrust',2,10,15,'Isolation',10),ex('Leg Extension Machine',3,12,15,'Isolation',10),ex('Seated Leg Curl',3,10,12,'Isolation',10)]}]},
  ul:{id:'ul',name:'Upper / Lower',short:'U/L',freq:'4x / week',sessions:[
    {key:'upper',label:'Upper',exercises:[ex('Flat Barbell Bench Press',2,6,10,'Compound',8),ex('Bent Over Barbell Row',2,8,10,'Compound',8),ex('Dumbbell Lateral Raise',4,12,15,'Isolation',10),ex('V-Bar Lat Pulldown',3,8,12,'Compound',8),ex('Cable Chest Fly',3,12,15,'Isolation',10),ex('Cable Overhead Tricep Extension',2,10,12,'Isolation',10),ex('Barbell Curl',2,10,12,'Isolation',10)]},
    {key:'lower',label:'Lower',exercises:[ex('Barbell Back Squat',3,5,8,'Compound',8),ex('Romanian Deadlift',3,8,12,'Compound',8),ex('Hip Thrust',2,10,15,'Isolation',10),ex('Leg Extension Machine',3,12,15,'Isolation',10),ex('Seated Leg Curl',3,10,12,'Isolation',10)]}]}
};

const toDisp=(kg,u)=>u==='kg'?Math.round(kg*10)/10:Math.round(kg/0.4536*10)/10;
const fmtDate=d=>new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fmtTime=s=>Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
const fmt=n=>Math.round(n).toLocaleString();
const DEF_ST={cur:0,best:0,lastDate:null,total:0,dates:[]};
const ACTS=[{v:'sedentary',t:'Sedentary',d:'Desk job, little exercise'},{v:'light',t:'Lightly Active',d:'1-2 sessions/week'},{v:'moderate',t:'Moderately Active',d:'3-4 sessions/week',rec:true},{v:'active',t:'Very Active',d:'5-6 sessions/week'},{v:'extreme',t:'Extremely Active',d:'Daily training'}];

function prevBest(hist,label,name){for(const h of hist){if(h.label!==label)continue;const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.sets&&e.sets.length){const ws=e.sets.map(s=>s.kg||0).filter(w=>w>0);if(ws.length)return Math.max(...ws);}}return null;}
function allBest(hist,name){let b=null;for(const h of hist){const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.sets&&e.sets.length){const ws=e.sets.map(s=>s.kg||0).filter(w=>w>0);if(ws.length){const m=Math.max(...ws);if(b===null||m>b)b=m;}}}return b;}
function lastNotes(hist,label,name){for(const h of hist){if(h.label!==label)continue;const e=h.exercises&&h.exercises.find(x=>x.name===name);if(e&&e.notes)return e.notes;}return '';}
function nextSess(pid,hist){const ss=PROGS[pid].sessions;const ph=hist.filter(h=>h.planId===pid);if(!ph.length)return ss[0].label;const idx=ss.findIndex(s=>s.label===ph[0].label);return ss[(idx<0?0:idx+1)%ss.length].label;}

// ── SHARED UI ──────────────────────────────────────────────────────────────────
const Btn=({onClick,ch,style,dis})=><button onClick={onClick} disabled={!!dis} style={{opacity:dis?0.5:1,display:'flex',alignItems:'center',justifyContent:'center',...style}}>{ch}</button>;
const Card=({ch,style})=><div style={{background:S,borderRadius:12,border:'1px solid '+B,padding:16,...style}}>{ch}</div>;

// All screens fill the container — same as working screens (Home, Nutrition etc.)
// Using position:absolute;inset:0 which gives explicit dimensions on iOS
const FS=({children,col,scroll,style})=>(
  <div style={{position:'absolute',inset:0,background:'#0A0A0A',
    ...(col?{display:'flex',flexDirection:'column'}:{}),
    ...(scroll?{overflowY:'auto',WebkitOverflowScrolling:'touch'}:{}),
    ...style}}>
    {children}
  </div>
);

// ── ONBOARDING ────────────────────────────────────────────────────────────────
function Onboarding({onDone}){
  const [step,setStep]=useState(1);
  const [name,setName]=useState('');
  const [plan,setPlan]=useState(null);
  const [unit,setUnit]=useState('kg');
  const [err,setErr]=useState('');
  function next(){
    if(step===2&&!name.trim()){setErr('Please enter your name');return;}
    if(step===3&&!plan){setErr('Choose a programme');return;}
    setErr('');
    if(step<4)setStep(s=>s+1);
    else onDone({name:name.trim(),plan:plan||'ppl',unit});
  }
  const Pill=({a,on,l})=><Btn on={on} onClick={on} ch={l} style={{flex:1,height:44,borderRadius:10,background:a?A:'transparent',color:a?'#000':'#9CA3AF',border:'1px solid '+B,fontSize:14,fontWeight:700}}/>;
  return(
    <div style={{position:'fixed',inset:0,background:'#0A0A0A',display:'flex',flexDirection:'column',padding:'60px 24px 32px',overflowY:'auto'}}>
      <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:28}}>{[1,2,3,4].map(n=><div key={n} style={{width:8,height:8,borderRadius:'50%',background:n<=step?A:B}}/>)}</div>
      <div style={{flex:1}}>
        {step===1&&<div style={{textAlign:'center',marginTop:32}}>
          <div style={{fontSize:13,fontWeight:800,color:A,letterSpacing:'0.1em',marginBottom:14}}>CONSTANTINE FITNESS</div>
          <div style={{fontSize:26,fontWeight:800,lineHeight:1.3,marginBottom:12}}>Built for people who train seriously.</div>
          <div style={{fontSize:14,color:'#9CA3AF',lineHeight:1.6}}>Set up your profile in 60 seconds.</div>
        </div>}
        {step===2&&<div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:22,fontWeight:800}}>What should we call you?</div>
          <input value={name} onChange={e=>{setName(e.target.value);setErr('');}} placeholder="First name" type="text" autoComplete="off"
            style={{height:52,borderRadius:12,background:S,border:'1px solid '+(err?R:B),color:'#fff',fontSize:16,padding:'0 16px'}}/>
          {err&&<div style={{fontSize:13,color:R}}>{err}</div>}
        </div>}
        {step===3&&<div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:22,fontWeight:800}}>Choose your programme</div>
          {Object.values(PROGS).map(p=><div key={p.id} onClick={()=>{setPlan(p.id);setErr('');}}
            style={{background:S,border:'2px solid '+(plan===p.id?A:B),borderRadius:12,padding:16,cursor:'pointer',position:'relative'}}>
            <div style={{fontSize:16,fontWeight:800,marginBottom:3}}>{p.name}</div>
            <div style={{fontSize:12,color:'#9CA3AF'}}>{p.freq}</div>
            {plan===p.id&&<div style={{position:'absolute',top:12,right:12,width:22,height:22,borderRadius:'50%',background:A,color:'#000',fontSize:13,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>&#10003;</div>}
          </div>)}
          {err&&<div style={{fontSize:13,color:R}}>{err}</div>}
        </div>}
        {step===4&&<div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div style={{fontSize:22,fontWeight:800}}>Preferences</div>
          <div>
            <div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:8}}>WEIGHT UNITS</div>
            <div style={{display:'flex',gap:8}}><Pill a={unit==='kg'} on={()=>setUnit('kg')} l="kg"/><Pill a={unit==='lbs'} on={()=>setUnit('lbs')} l="lbs"/></div>
          </div>
          <Card ch={<div style={{fontSize:13,color:'#9CA3AF',lineHeight:1.6}}>Every exercise uses <strong style={{color:'#fff'}}>double progression</strong> — add reps until you hit the top of the range, then increase weight.</div>}/>
        </div>}
      </div>
      <Btn onClick={next} ch={step===1?"Let's Go":step===4?'Get Started':'Next'}
        style={{width:'100%',height:54,borderRadius:12,background:'linear-gradient(135deg,#065F46,'+A+')',color:'#000',fontSize:17,fontWeight:800,marginTop:16}}/>
    </div>
  );
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function Home({planId,hist,streak,onStart,onSettings}){
  const prog=PROGS[planId];
  const [sel,setSel]=useState(null);
  const rec=nextSess(planId,hist);
  const active=sel||rec;
  const sess=prog.sessions.find(s=>s.label===active)||prog.sessions[0];
  const tot=sess.exercises.reduce((a,e)=>a+e.sets,0);
  const est=Math.round((tot*3.2+sess.exercises.length*1.2)/5)*5;
  return(
    <FS scroll>
      <div style={{padding:'60px 20px 20px'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:16}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:'#6B7280',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:3}}>Next Up</div>
            <div style={{fontSize:24,fontWeight:800}}>{active}</div>
          </div>
          <Btn onClick={onSettings} ch="&#9881;&#65039;" style={{width:36,height:36,borderRadius:10,background:S,border:'1px solid '+B,color:'#9CA3AF',fontSize:18}}/>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          {[{v:streak.cur,l:'Streak',e:'&#128293;',hi:streak.cur>7},{v:streak.best,l:'Best',e:'&#127942;'},{v:streak.total,l:'Sessions',e:'&#128170;'}].map((c,i)=>(
            <div key={i} style={{flex:1,background:'#1E1E1E',borderRadius:12,padding:'10px 6px',textAlign:'center',border:'1px solid '+(c.hi?A:B)}}>
              <div style={{fontSize:18,marginBottom:2}} dangerouslySetInnerHTML={{__html:c.e}}/>
              <div style={{fontSize:18,fontWeight:800}}>{c.v}</div>
              <div style={{fontSize:10,color:'#9CA3AF',fontWeight:600}}>{c.l}</div>
            </div>
          ))}
        </div>
        <Card ch={<>
          <div style={{fontSize:15,fontWeight:700,marginBottom:2}}>{active}</div>
          <div style={{fontSize:12,color:'#9CA3AF',marginBottom:12}}>{sess.exercises.length} exercises &bull; {tot} sets &bull; ~{est} min</div>
          <Btn onClick={()=>onStart(sess)} ch="Start Session"
            style={{width:'100%',height:50,borderRadius:12,background:'linear-gradient(135deg,#065F46,'+A+')',color:'#000',fontSize:16,fontWeight:800}}/>
        </>} style={{marginBottom:16}}/>
        <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>All Sessions</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat('+prog.sessions.length+',1fr)',gap:8}}>
          {prog.sessions.map((s,i)=>{
            const isSel=s.label===active,isRec=s.label===rec;
            return<div key={i} onClick={()=>setSel(s.label===sel?null:s.label)}
              style={{padding:'9px 6px',borderRadius:12,textAlign:'center',cursor:'pointer',
                background:isSel?'rgba(245,158,11,0.15)':'transparent',border:'1px solid '+(isSel?A:B)}}>
              <div style={{fontSize:12,fontWeight:700,color:isSel?'#fff':'#9CA3AF'}}>{s.label}</div>
              {isRec&&!isSel&&<div style={{fontSize:9,color:A,marginTop:1}}>&#9658; next</div>}
            </div>;
          })}
        </div>
      </div>
    </FS>
  );
}

// ── PROGRAMMES ────────────────────────────────────────────────────────────────
function Programmes({planId,onStart}){
  const [view,setView]=useState(planId);
  const prog=PROGS[view];
  return(
    <FS scroll>
      <div style={{padding:'60px 20px 20px'}}>
        <div style={{fontSize:22,fontWeight:800,marginBottom:12}}>Programmes</div>
        <div style={{display:'flex',background:S,border:'1px solid '+B,borderRadius:12,padding:4,marginBottom:14}}>
          {Object.values(PROGS).map(p=><div key={p.id} onClick={()=>setView(p.id)}
            style={{flex:1,textAlign:'center',padding:10,borderRadius:9,fontSize:13,fontWeight:700,cursor:'pointer',
              background:view===p.id?A:'transparent',color:view===p.id?'#000':'#9CA3AF'}}>{p.short}</div>)}
        </div>
        {prog.sessions.map((s,i)=>{
          const tot=s.exercises.reduce((a,e)=>a+e.sets,0);
          const est=Math.round((tot*3.2+s.exercises.length*1.2)/5)*5;
          return<Card key={i} style={{marginBottom:10,cursor:'pointer'}} ch={<>
            <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>{s.label}</div>
            <div style={{fontSize:12,color:'#9CA3AF'}}>{s.exercises.length} exercises &bull; {tot} sets &bull; ~{est} min</div>
          </>} onClick={()=>onStart(s,view)}/>;
        })}
      </div>
    </FS>
  );
}

// ── SESSION OVERVIEW ──────────────────────────────────────────────────────────
function SessionOverview({planId,sess,hist,unit,swaps,onSaveSwap,onBegin,onBack}){
  const [swapIdx,setSwapIdx]=useState(null);
  const sk=(i)=>planId+'_'+sess.label+'_'+i;
  const nm=(e,i)=>(swaps&&swaps[sk(i)])||e.name;
  return(
    <FS col>
      <div style={{padding:'60px 20px 0',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <Btn onClick={onBack} ch="&#8249;" style={{width:36,height:36,borderRadius:10,background:'#1E1E1E',border:'1px solid '+B,color:'#fff',fontSize:22}}/>
          <div style={{fontSize:12,color:'#9CA3AF',fontWeight:600}}>{PROGS[planId].name}</div>
        </div>
        <div style={{fontSize:20,fontWeight:800,marginBottom:2}}>{sess.label}</div>
        <div style={{fontSize:13,color:'#9CA3AF',marginBottom:10}}>{sess.exercises.length} exercises &bull; {sess.exercises.reduce((a,e)=>a+e.sets,0)} sets</div>
      </div>
      <div style={{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'4px 20px 12px'}}>
        {sess.exercises.map((e,i)=>{
          const name=nm(e,i),swapped=name!==e.name;
          const lh=hist.find(h=>h.label===sess.label&&h.exercises&&h.exercises.find(x=>x.name===name));
          const le=lh&&lh.exercises.find(x=>x.name===name);
          return<Card key={i} style={{marginBottom:10}} ch={<>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
              <div style={{fontSize:14,fontWeight:700,color:swapped?A:'#fff',flex:1}}>{name}</div>
              {le&&le.sets.some(s=>s.reps>=e.rHi)&&<span style={{color:A,fontSize:12}}>&#8593;</span>}
              <Btn onClick={()=>setSwapIdx(swapIdx===i?null:i)} ch="&#8644;"
                style={{width:26,height:26,borderRadius:'50%',background:'#1E1E1E',border:'1px solid '+B,color:'#9CA3AF',fontSize:13}}/>
            </div>
            <div style={{fontSize:12,color:'#9CA3AF',marginBottom:2}}>{e.sets} sets &times; {e.rLo}&ndash;{e.rHi} reps</div>
            <div style={{fontSize:11,color:e.rpe>=9?A:'#6B7280'}}>RPE {e.rpe} &mdash; {10-e.rpe} reps left</div>
            {swapped&&<Btn onClick={()=>onSaveSwap(sk(i),null)} ch={'Reset to '+e.name}
              style={{marginTop:7,fontSize:11,color:'#6B7280',border:'1px dashed '+B,borderRadius:6,padding:'3px 8px',height:'auto',width:'auto'}}/>}
          </>}/>;
        })}
      </div>
      <div style={{padding:'10px 20px 28px',borderTop:'1px solid '+B,flexShrink:0}}>
        <Btn onClick={onBegin} ch="Start Workout"
          style={{width:'100%',height:54,borderRadius:12,background:'linear-gradient(135deg,#065F46,'+A+')',color:'#000',fontSize:17,fontWeight:800}}/>
      </div>
      {swapIdx!==null&&<>
        <div onClick={()=>setSwapIdx(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.65)',zIndex:40}}/>
        <div style={{position:'fixed',left:0,right:0,bottom:0,maxHeight:'70%',background:'#161616',borderRadius:'20px 20px 0 0',zIndex:41,display:'flex',flexDirection:'column'}}>
          <div onClick={()=>setSwapIdx(null)} style={{display:'flex',justifyContent:'center',padding:'10px 0 6px',cursor:'pointer'}}><div style={{width:40,height:4,borderRadius:2,background:'#3A3A3A'}}/></div>
          <div style={{padding:'4px 20px 10px',borderBottom:'1px solid '+B}}>
            <div style={{fontSize:15,fontWeight:800}}>Swap Exercise</div>
            <div style={{fontSize:11,color:A,fontWeight:600,marginTop:2}}>Saves permanently for this session</div>
          </div>
          <div style={{overflowY:'auto',padding:'8px 20px 28px',display:'flex',flexDirection:'column',gap:7}}>
            {(ALT[sess.exercises[swapIdx]&&sess.exercises[swapIdx].name]||[]).map((alt,j)=>
              <div key={j} onClick={()=>{onSaveSwap(sk(swapIdx),alt);setSwapIdx(null);}}
                style={{padding:'11px 14px',borderRadius:10,cursor:'pointer',fontSize:14,fontWeight:600,background:'#1E1E1E',border:'1px solid '+B}}>{alt}</div>)}
          </div>
        </div>
      </>}
    </FS>
  );
}

// ── ACTIVE WORKOUT ────────────────────────────────────────────────────────────
function ActiveWorkout({planId,sess,hist,unit,swaps,onSaveSwap,onDone,onExit}){
  const skKey=(i)=>planId+'_'+sess.label+'_'+i;
  const buildEx=()=>sess.exercises.map((e,i)=>{
    const name=(swaps&&swaps[skKey(i)])||e.name;
    const pb=prevBest(hist,sess.label,name);
    return{...e,name,base:e.name,ei:i,pb,atb:allBest(hist,name),
      pn:lastNotes(hist,sess.label,name),notes:'',
      logged:[],  // completed sets
      curW:pb!=null?String(toDisp(pb,unit)):'',
      curR:'',curRpe:''};
  });

  // All hooks first
  const [exs,setExs]=useState(buildEx);
  const [ei,setEi]=useState(0);
  const [pr,setPr]=useState(null);
  const [showSwap,setShowSwap]=useState(false);
  const [secs,setSecs]=useState(0);
  const [totSecs,setTotSecs]=useState(0);
  const [showCancel,setShowCancel]=useState(false);
  const tmr=useRef(null);
  const t0=useRef(Date.now());
  const tx=useRef(null);

  useEffect(()=>()=>{if(tmr.current)clearInterval(tmr.current);},[]);

  const cur=exs[ei];
  const setsDone=cur.logged.length;
  const setsTotal=cur.sets;
  const allSetsDone=setsDone>=setsTotal;
  const isLastEx=ei===exs.length-1;
  const pct=Math.round(((ei)/exs.length)*100 + (setsDone/setsTotal)*(100/exs.length));

  function startRest(s){
    if(tmr.current)clearInterval(tmr.current);
    setSecs(s);setTotSecs(s);
    tmr.current=setInterval(()=>setSecs(t=>{if(t<=1){clearInterval(tmr.current);return 0;}return t-1;}),1000);
  }
  function stopRest(){if(tmr.current)clearInterval(tmr.current);setSecs(0);setTotSecs(0);}

  function logSet(){
    const kg=parseFloat(cur.curW)||0;
    const reps=parseFloat(cur.curR)||0;
    if(!reps)return; // need at least reps
    const isPR=kg>0&&(cur.atb===null||kg>cur.atb);
    const hitTop=reps>=cur.rHi;
    const newLogged=[...cur.logged,{kg,reps,rpe:cur.curRpe,w:cur.curW,r:cur.curR}];
    setExs(p=>p.map((e,i)=>i!==ei?e:{...e,
      atb:isPR?kg:e.atb,
      hitTop:e.hitTop||hitTop,
      logged:newLogged,
      curW:cur.curW,
      curR:'',curRpe:''}));
    if(isPR)setPr({name:cur.name,kg});
    startRest(cur.type==='Compound'?120:60);
  }

  function nextExercise(){
    if(ei<exs.length-1){setEi(i=>i+1);setPr(null);stopRest();}
  }

  function doSwap(nm){
    onSaveSwap(skKey(cur.ei),nm);
    setExs(p=>p.map((e,i)=>{
      if(i!==ei)return e;
      const pb=prevBest(hist,sess.label,nm);
      return{...e,name:nm,pb,atb:allBest(hist,nm),pn:lastNotes(hist,sess.label,nm),
        curW:pb!=null?String(toDisp(pb,unit)):e.curW};
    }));
    setShowSwap(false);
  }

  function finish(){
    let vol=0;const prs=[];const toIncrease=[];
    const data=exs.map(e=>{
      e.logged.forEach(s=>{const kg=s.kg||0;vol+=kg*(s.reps||0);
        if(kg>0&&(e.atb===null||kg>e.atb)&&!prs.find(p=>p.name===e.name))prs.push({name:e.name,weight:toDisp(kg,unit)});});
      if(e.hitTop)toIncrease.push(e.name);
      return{name:e.name,rHi:e.rHi,notes:e.notes||'',
        sets:e.logged.map(s=>({kg:s.kg||0,reps:s.reps||0,rpe:s.rpe}))};
    }).filter(e=>e.sets.length||e.notes);
    onDone({planId,label:sess.label,date:new Date().toISOString(),vol:Math.round(vol),exercises:data},prs,Math.round((Date.now()-t0.current)/60000),toIncrease);
  }

  const lh=hist.find(h=>h.label===sess.label&&h.exercises&&h.exercises.find(x=>x.name===cur.name));
  const lEx=lh&&lh.exercises.find(x=>x.name===cur.name);

  // Primary action button label
  let actionLabel, actionFn, actionStyle;
  if(allSetsDone && isLastEx){
    actionLabel='Finish Workout \u2713';
    actionFn=finish;
    actionStyle={background:G};
  } else if(allSetsDone){
    actionLabel='Next Exercise \u203a';
    actionFn=nextExercise;
    actionStyle={background:'linear-gradient(135deg,#065F46,'+A+')'};
  } else {
    actionLabel='Log Set '+(setsDone+1)+' of '+setsTotal;
    actionFn=logSet;
    actionStyle={background:'linear-gradient(135deg,#065F46,'+A+')'};
  }

  const workout=(
    <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'#0A0A0A',zIndex:9999,display:'flex',flexDirection:'column'}}>

      {/* Header */}
      <div style={{background:'#0F0F0F',borderBottom:'1px solid #1E1E1E',padding:'48px 16px 14px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          {/* Progress bar */}
          <div style={{flex:1,height:3,background:'#1E1E1E',borderRadius:2,marginRight:12}}>
            <div style={{height:'100%',width:pct+'%',background:A,borderRadius:2,transition:'width 0.4s'}}/>
          </div>
          <div style={{fontSize:12,fontWeight:700,color:'#555',whiteSpace:'nowrap'}}>{ei+1} / {exs.length}</div>
        </div>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:A,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:4}}>{cur.type}</div>
            <div style={{fontSize:22,fontWeight:800,lineHeight:1.2,marginBottom:4}}>{cur.name}</div>
            <div style={{fontSize:13,color:'#555'}}>{cur.sets} sets &bull; {cur.rLo}&ndash;{cur.rHi} reps &bull; RPE {cur.rpe}</div>
            {cur.pb!=null&&<div style={{fontSize:12,color:'#444',marginTop:3}}>Previous best: <span style={{color:'#888',fontWeight:600}}>{toDisp(cur.pb,unit)}{unit}</span></div>}
            {lEx&&lEx.sets&&lEx.sets.some(s=>s.reps>=cur.rHi)&&<div style={{fontSize:12,color:A,fontWeight:600,marginTop:4}}>&#8593; You maxed reps last time — add weight today</div>}
          </div>
          <button onClick={()=>setShowSwap(true)}
            style={{background:'#1A1A1A',border:'1px solid #2A2A2A',borderRadius:8,color:'#666',fontSize:12,padding:'7px 10px',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
            &#8644; Swap
          </button>
        </div>
        {/* Banners */}
        {pr&&<div style={{display:'flex',alignItems:'center',gap:8,background:'rgba(52,211,153,0.15)',border:'1px solid rgba(52,211,153,0.4)',borderRadius:8,padding:'8px 12px',marginTop:10}}>
          <span>&#127942;</span><div style={{flex:1,fontSize:13,fontWeight:700,color:'#34D399'}}>New PR &mdash; {toDisp(pr.kg,unit)}{unit} on {pr.name}!</div>
          <button onClick={()=>setPr(null)} style={{background:'transparent',border:'none',color:'#555',fontSize:16,cursor:'pointer',padding:0}}>&#10005;</button>
        </div>}

      </div>

      {/* Body */}
      <div style={{flex:1,overflowY:'scroll',WebkitOverflowScrolling:'touch',padding:'16px 16px 8px'}}>
        {/* Completed sets log */}
        {cur.logged.length>0&&<div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Completed</div>
          {cur.logged.map((s,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'rgba(52,211,153,0.08)',border:'1px solid rgba(52,211,153,0.2)',borderRadius:8,marginBottom:6}}>
            <span style={{fontSize:16,color:G}}>&#10003;</span>
            <div style={{flex:1,fontSize:14,color:'#888'}}>Set {i+1}</div>
            <div style={{fontSize:15,fontWeight:700,color:'#ccc'}}>{s.w}{unit}</div>
            <div style={{fontSize:15,fontWeight:700,color:'#ccc'}}>{s.r} reps</div>
            {s.rpe&&<div style={{fontSize:12,color:'#555'}}>RPE {s.rpe}</div>}
          </div>)}
        </div>}

        {/* Last session reference */}
        {lEx&&lEx.sets&&lEx.sets.length>0&&!allSetsDone&&<div style={{background:'#111',borderLeft:'2px solid #2A2A2A',borderRadius:8,padding:'10px 14px',marginBottom:16}}>
          <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Last Session</div>
          {lEx.sets.map((s,i)=><div key={i} style={{display:'flex',gap:12,fontSize:13,color:'#555',lineHeight:1.8}}>
            <span>Set {i+1}</span><span>{toDisp(s.kg,unit)}{unit} &times; {s.reps}</span>
          </div>)}
        </div>}

        {/* Current set inputs — shown when sets remain */}
        {!allSetsDone&&<>
          <div style={{fontSize:11,color:A,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10}}>
            Set {setsDone+1} of {setsTotal}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:16}}>
            {/* Weight */}
            <div>
              <div style={{fontSize:11,color:'#555',fontWeight:600,marginBottom:6,textAlign:'center'}}>{unit==='kg'?'Kg':'Lbs'}</div>
              <input value={cur.curW} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,curW:e.target.value}))}
                type="text" inputMode="decimal" pattern="[0-9.]*" autoComplete="off" placeholder="0"
                style={{width:'100%',height:56,background:'#111',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:22,fontWeight:700,textAlign:'center',outline:'none'}}/>
            </div>
            {/* Reps */}
            <div>
              <div style={{fontSize:11,color:'#555',fontWeight:600,marginBottom:6,textAlign:'center'}}>Reps</div>
              <input value={cur.curR} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,curR:e.target.value}))}
                type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" placeholder="0"
                style={{width:'100%',height:56,background:'#111',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:22,fontWeight:700,textAlign:'center',outline:'none'}}/>
            </div>
            {/* RPE */}
            <div>
              <div style={{fontSize:11,color:'#555',fontWeight:600,marginBottom:6,textAlign:'center'}}>RPE</div>
              <input value={cur.curRpe} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,curRpe:e.target.value}))}
                type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" placeholder="–"
                style={{width:'100%',height:56,background:'#111',border:'1px solid #2A2A2A',borderRadius:10,color:'#fff',fontSize:22,fontWeight:700,textAlign:'center',outline:'none'}}/>
            </div>
          </div>
        </>}

        {/* Rest timer */}
        {secs>0&&<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#111',border:'1px solid #1E1E1E',borderRadius:10,padding:'12px 16px',marginBottom:12}}>
          <div>
            <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>Rest</div>
            <div style={{fontSize:26,fontWeight:800,color:A,fontVariantNumeric:'tabular-nums'}}>{fmtTime(secs)}</div>
          </div>
          <button onClick={stopRest} style={{background:'#1A1A1A',border:'1px solid #2A2A2A',borderRadius:8,color:'#555',fontSize:13,padding:'8px 14px',cursor:'pointer',fontFamily:'inherit'}}>Skip</button>
        </div>}

        {/* Notes (shown after all sets done) */}
        {allSetsDone&&<>
          {cur.pn&&<div style={{background:'#111',borderLeft:'2px solid #2A2A2A',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
            <div style={{fontSize:11,color:'#444',fontWeight:700,textTransform:'uppercase',marginBottom:4}}>Last Notes</div>
            <div style={{fontSize:13,color:'#555'}}>{cur.pn}</div>
          </div>}
          <textarea value={cur.notes} onChange={e=>setExs(p=>p.map((ex,i)=>i!==ei?ex:{...ex,notes:e.target.value}))}
            placeholder="Notes for this exercise..."
            style={{width:'100%',height:52,background:'#111',border:'1px solid #1E1E1E',borderRadius:10,color:'#fff',fontSize:13,padding:'8px 12px',fontFamily:'inherit',lineHeight:1.4,outline:'none',marginBottom:8}}/>
        </>}
      </div>

      {/* Footer */}
      <div style={{background:'#0F0F0F',borderTop:'1px solid #1E1E1E',padding:'12px 16px 32px',display:'flex',flexDirection:'column',gap:10,flexShrink:0}}>
        {/* Primary action */}
        <button onClick={actionFn} style={{width:'100%',height:54,borderRadius:14,border:'none',cursor:'pointer',fontSize:16,fontWeight:800,color:'#fff',fontFamily:'inherit',...actionStyle}}>
          {actionLabel}
        </button>
        {/* Cancel workout */}
        <button onClick={()=>setShowCancel(true)}
          style={{width:'100%',height:44,borderRadius:12,border:'1px solid #1E1E1E',background:'transparent',color:'#444',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
          Cancel Workout
        </button>
      </div>

      {/* Cancel confirm dialog */}
      {showCancel&&<>
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.8)',zIndex:10}}/>
        <div style={{position:'absolute',left:20,right:20,top:'50%',transform:'translateY(-50%)',background:'#111',border:'1px solid #2A2A2A',borderRadius:16,padding:22,zIndex:11}}>
          <div style={{fontSize:17,fontWeight:800,marginBottom:6}}>Cancel Workout?</div>
          <div style={{fontSize:14,color:'#555',lineHeight:1.5,marginBottom:18}}>Your progress won't be saved.</div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={()=>setShowCancel(false)} style={{flex:1,height:46,borderRadius:10,border:'1px solid #2A2A2A',background:'transparent',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Keep Going</button>
            <button onClick={onExit} style={{flex:1,height:46,borderRadius:10,border:'none',background:'#1E1E1E',color:'#666',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
          </div>
        </div>
      </>}

      {/* Swap sheet */}
      {showSwap&&<>
        <div onClick={()=>setShowSwap(false)} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)',zIndex:10}}/>
        <div style={{position:'absolute',left:0,right:0,bottom:0,maxHeight:'70%',background:'#111',borderRadius:'20px 20px 0 0',zIndex:11,display:'flex',flexDirection:'column'}}>
          <div onClick={()=>setShowSwap(false)} style={{display:'flex',justifyContent:'center',padding:'10px 0 6px',cursor:'pointer'}}>
            <div style={{width:36,height:3,borderRadius:2,background:'#2A2A2A'}}/>
          </div>
          <div style={{padding:'4px 20px 12px',borderBottom:'1px solid #1E1E1E'}}>
            <div style={{fontSize:15,fontWeight:800}}>Swap Exercise</div>
            <div style={{fontSize:12,color:'#444',marginTop:2}}>Saves for future sessions</div>
          </div>
          <div style={{overflowY:'scroll',WebkitOverflowScrolling:'touch',padding:'8px 20px 28px',display:'flex',flexDirection:'column',gap:7}}>
            {(ALT[cur.base]||[]).map((alt,j)=>(
              <button key={j} onClick={()=>doSwap(alt)} style={{padding:'12px 14px',borderRadius:10,cursor:'pointer',fontSize:14,fontWeight:600,textAlign:'left',fontFamily:'inherit',
                background:cur.name===alt?'rgba(16,185,129,0.1)':'#1A1A1A',border:'1px solid '+(cur.name===alt?A:'#2A2A2A'),color:'#fff'}}>
                {alt}
              </button>
            ))}
            {cur.name!==cur.base&&<button onClick={()=>doSwap(cur.base)} style={{padding:12,borderRadius:10,border:'1px dashed #2A2A2A',background:'transparent',color:'#555',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
              Reset to {cur.base}
            </button>}
          </div>
        </div>
      </>}
    </div>
  );

  return ReactDOM.createPortal(workout, document.body);
}


function WorkoutComplete({entry,unit,prs,duration,toIncrease,onHome}){
  const vol=toDisp(entry.vol||0,unit);
  const sets=entry.exercises.reduce((a,e)=>a+e.sets.length,0);
  return(
    <FS col>
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',textAlign:'center'}}>
        <div style={{fontSize:56,marginBottom:6}}>&#127942;</div>
        <div style={{fontSize:24,fontWeight:800,marginBottom:4}}>Session Complete!</div>
        <div style={{fontSize:14,color:'#9CA3AF',marginBottom:22}}>{entry.label}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,width:'100%',marginBottom:16}}>
          {[['&#128230;',vol+' '+unit,'Volume'],['&#9989;',String(sets),'Sets'],['&#128170;',String(entry.exercises.length),'Exercises'],['&#9201;',duration+' min','Duration']].map(([ic,v,l],i)=>(
            <div key={i} style={{background:'#161616',border:'1px solid '+B,borderRadius:12,padding:'12px 10px'}}>
              <div style={{fontSize:18,marginBottom:3}} dangerouslySetInnerHTML={{__html:ic}}/>
              <div style={{fontSize:16,fontWeight:800,color:A}}>{v}</div>
              <div style={{fontSize:10,color:'#6B7280',fontWeight:600,marginTop:2}}>{l}</div>
            </div>
          ))}
        </div>
        {prs.length>0&&<div style={{width:'100%',background:'linear-gradient(135deg,#065F46,#10B981)',borderRadius:12,padding:'12px 16px',marginBottom:12,textAlign:'left'}}>
          <div style={{fontSize:12,fontWeight:800,color:'#D1FAE5',marginBottom:4}}>&#127942; Personal Records</div>
          {prs.map((p,i)=><div key={i} style={{fontSize:12,color:'#D1FAE5',lineHeight:1.8}}>{p.name} &mdash; {p.weight}{unit}</div>)}
        </div>}
        {toIncrease&&toIncrease.length>0&&<div style={{width:'100%',background:'#161616',border:'1px solid '+B,borderRadius:12,padding:'12px 16px',marginBottom:16,textAlign:'left'}}>
          <div style={{fontSize:12,fontWeight:800,color:A,marginBottom:4}}>&#8593; Ready to increase next time</div>
          {toIncrease.map((n,i)=><div key={i} style={{fontSize:12,color:'#9CA3AF',lineHeight:1.8}}>{n}</div>)}
        </div>}
        <Btn onClick={onHome} ch="Back to Home" style={{width:'100%',height:50,borderRadius:12,background:'linear-gradient(135deg,#065F46,'+A+')',color:'#000',fontSize:16,fontWeight:800}}/>
      </div>
    </FS>
  );
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────

// ── NUTRITION ─────────────────────────────────────────────────────────────────
function Nutrition({saved,savedRes,onSave,onSaveRes}){
  const DEF={gender:'male',age:'',cm:'',ft:'',inch:'',kg:'',lbs:'',activity:'moderate'};
  const [n,setN]=useState(saved||DEF);
  const [res,setRes]=useState(savedRes||null);
  const [errs,setErrs]=useState({});
  const upd=(f,v)=>setN(p=>({...p,[f]:v}));
  const updS=(patch)=>{const nx={...n,...patch};setN(nx);onSave(nx);};
  function calc(){
    onSave(n);const er={};
    const age=parseFloat(n.age)||0;if(!age)er.age='Enter age';
    const cm=parseFloat(n.cm)||((parseFloat(n.ft)||0)*30.48+(parseFloat(n.inch)||0)*2.54);if(!cm)er.h='Enter height';
    const kg=parseFloat(n.kg)||((parseFloat(n.lbs)||0)/2.20462);if(!kg)er.w='Enter weight';
    if(Object.keys(er).length){setErrs(er);return;}
    setErrs({});
    const m=n.gender==='male';
    const bmr=m?(10*kg+6.25*cm-5*age+5):(10*kg+6.25*cm-5*age-161);
    const tdee=bmr*({sedentary:1.2,light:1.375,moderate:1.55,active:1.725,extreme:1.9}[n.activity]||1.55);
    const lbsW=kg*2.20462;
    const pMin=Math.round(lbsW*0.73),pTgt=Math.round(lbsW*0.82);
    const fMin=Math.round(m?kg:kg*0.7),fTgt=Math.round(m?kg*1.2:kg*0.9);
    const mLo=tdee+350,mHi=tdee+500;
    const r={bmr:Math.round(bmr),tdee:Math.round(tdee),mLo:Math.round(mLo),mHi:Math.round(mHi),pMin,pTgt,fMin,fTgt,cLo:Math.round((mLo-fMin*9-pMin*4)/4),cHi:Math.round((mHi-fTgt*9-pTgt*4)/4),m};
    setRes(r);onSaveRes(r);
  }
  const Pill=({a,on,l})=><Btn on={on} onClick={on} ch={l} style={{flex:1,height:44,borderRadius:10,background:a?A:'transparent',color:a?'#000':'#9CA3AF',border:'1px solid '+B,fontSize:14,fontWeight:700}}/>;
  const iSty=(err)=>({width:'100%',height:48,background:'#0A0A0A',border:'1px solid '+(err?R:B),borderRadius:8,color:'#fff',fontSize:16,padding:'0 12px',outline:'none'});
  const FL=({c})=><div style={{fontSize:11,color:'#9CA3AF',fontWeight:600,marginBottom:4}}>{c}</div>;
  const RC=({val,lbl,sub,color,hi})=><Card style={{border:hi?'2px solid '+A:'1px solid '+B,marginBottom:10}} ch={<><div style={{fontSize:18,fontWeight:800,color:color||'#fff'}}>{val}</div><div style={{fontSize:10,color:'#6B7280',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.04em',margin:'2px 0 2px'}}>{lbl}</div><div style={{fontSize:11,color:'#9CA3AF'}}>{sub}</div></>}/>;
  return(
    <FS scroll>
      <div style={{padding:'60px 20px 20px'}}>
        <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>Nutrition</div>
        <div style={{fontSize:13,color:'#9CA3AF',marginBottom:12}}>Get your personalised macro targets.</div>
        <Card style={{marginBottom:12,display:'flex',flexDirection:'column',gap:14}} ch={<>
          <div><div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>GENDER</div>
            <div style={{display:'flex',gap:8}}><Pill a={n.gender==='male'} on={()=>updS({gender:'male'})} l="Male"/><Pill a={n.gender==='female'} on={()=>updS({gender:'female'})} l="Female"/></div>
          </div>
          <div><div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>AGE</div>
            <div style={{position:'relative'}}>
              <input value={n.age} onChange={e=>upd('age',e.target.value)} type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" placeholder="e.g. 25" style={{...iSty(errs.age),paddingRight:52}}/>
              <div style={{position:'absolute',right:12,top:0,height:48,display:'flex',alignItems:'center',fontSize:12,color:'#6B7280',fontWeight:600}}>years</div>
            </div>
            {errs.age&&<div style={{fontSize:12,color:R,marginTop:4}}>{errs.age}</div>}
          </div>
          <div><div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>HEIGHT</div>
            <div style={{marginBottom:7}}><FL c="cm"/><input value={n.cm} onChange={e=>upd('cm',e.target.value)} type="text" inputMode="decimal" pattern="[0-9.]*" autoComplete="off" placeholder="e.g. 178" style={iSty(errs.h)}/></div>
            <div style={{fontSize:11,color:'#6B7280',textAlign:'center',marginBottom:7}}>or</div>
            <div style={{display:'flex',gap:8}}>
              <div style={{flex:1}}><FL c="ft"/><input value={n.ft} onChange={e=>upd('ft',e.target.value)} type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" placeholder="5" style={iSty(errs.h)}/></div>
              <div style={{flex:1}}><FL c="in"/><input value={n.inch} onChange={e=>upd('inch',e.target.value)} type="text" inputMode="numeric" pattern="[0-9]*" autoComplete="off" placeholder="10" style={iSty(errs.h)}/></div>
            </div>
            {errs.h&&<div style={{fontSize:12,color:R,marginTop:4}}>{errs.h}</div>}
          </div>
          <div><div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>BODY WEIGHT</div>
            <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
              <div style={{flex:1}}><FL c="kg"/><input value={n.kg} onChange={e=>upd('kg',e.target.value)} type="text" inputMode="decimal" pattern="[0-9.]*" autoComplete="off" placeholder="e.g. 80" style={iSty(errs.w)}/></div>
              <div style={{paddingBottom:12,color:'#6B7280',fontSize:11,fontWeight:600,flexShrink:0}}>or</div>
              <div style={{flex:1}}><FL c="lbs"/><input value={n.lbs} onChange={e=>upd('lbs',e.target.value)} type="text" inputMode="decimal" pattern="[0-9.]*" autoComplete="off" placeholder="e.g. 176" style={iSty(errs.w)}/></div>
            </div>
            {errs.w&&<div style={{fontSize:12,color:R,marginTop:4}}>{errs.w}</div>}
          </div>
          <div><div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>ACTIVITY LEVEL</div>
            {ACTS.map(a=><div key={a.v} onClick={()=>updS({activity:a.v})}
              style={{padding:'9px 12px',borderRadius:10,cursor:'pointer',marginBottom:6,background:n.activity===a.v?'rgba(245,158,11,0.1)':'#1E1E1E',border:'1px solid '+(n.activity===a.v?A:B)}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                <div style={{fontSize:13,fontWeight:700,color:n.activity===a.v?'#fff':'#E5E7EB'}}>{a.t}</div>
                {a.rec&&<div style={{fontSize:9,fontWeight:700,color:G,background:'rgba(52,211,153,0.15)',borderRadius:4,padding:'2px 6px',whiteSpace:'nowrap'}}>RECOMMENDED</div>}
              </div>
              <div style={{fontSize:11,color:'#6B7280',marginTop:1}}>{a.d}</div>
            </div>)}
          </div>
          <Btn onClick={calc} ch="Calculate" style={{width:'100%',height:50,borderRadius:12,background:'linear-gradient(135deg,#065F46,'+A+')',color:'#000',fontSize:15,fontWeight:800}}/>
        </>}/>
        {res&&<div>
          <RC val={fmt(res.bmr)+' kcal'} lbl="BMR" sub="Base metabolic rate at rest"/>
          <RC val={fmt(res.tdee)+' kcal'} lbl="TDEE" sub="Total daily calories to maintain weight"/>
          <RC val={fmt(res.mLo)+' \u2013 '+fmt(res.mHi)+' kcal'} lbl="Muscle Building" sub="TDEE + 350-500 kcal surplus" hi color={A}/>
          <RC val={res.pMin+'g \u2013 '+res.pTgt+'g'} lbl="Protein" sub="0.7-0.8g per lb bodyweight" color="#F97316"/>
          <RC val={res.fMin+'g \u2013 '+res.fTgt+'g ('+(res.m?'1.0-1.2':'0.7-0.9')+'g/kg)'} lbl="Fat" sub="Hormone health optimised" color={res.m?A:'#60A5FA'}/>
          <RC val={res.cLo+'g \u2013 '+res.cHi+'g'} lbl="Carbohydrates" sub="Remaining after protein and fat" color={G}/>
          <div style={{fontSize:11,color:'#6B7280',lineHeight:1.5,padding:'4px 0 8px'}}>Estimates based on population averages.</div>
        </div>}
      </div>
    </FS>
  );
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function Settings({name,unit,planId,onSave,onReset,onResetAll,onClose}){
  const [nm,setNm]=useState(name);const [u,setU]=useState(unit);const [p,setP]=useState(planId);
  const [showP,setShowP]=useState(false);const [confirm,setConfirm]=useState(null);
  const Pill=({a,on,l})=><Btn on={on} onClick={on} ch={l} style={{flex:1,height:44,borderRadius:10,background:a?A:'transparent',color:a?'#000':'#9CA3AF',border:'1px solid '+B,fontSize:14,fontWeight:700}}/>;
  return(
    <FS scroll>
      <div style={{padding:'60px 20px 20px'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}><Btn onClick={onClose} ch="&#8249;" style={{width:36,height:36,borderRadius:10,background:'#1E1E1E',border:'1px solid '+B,color:'#fff',fontSize:22}}/><div style={{fontSize:20,fontWeight:800}}>Settings</div></div>
        <div style={{fontSize:11,color:'#6B7280',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Profile</div>
        <Card style={{marginBottom:14}} ch={<>
          <div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>Name</div>
          <input value={nm} onChange={e=>setNm(e.target.value)} onBlur={()=>onSave({name:nm,unit:u,planId:p})} type="text" autoComplete="off"
            style={{width:'100%',height:44,background:'#0A0A0A',border:'1px solid '+B,borderRadius:8,color:'#fff',fontSize:15,padding:'0 12px',outline:'none'}}/>
        </>}/>
        <div style={{fontSize:11,color:'#6B7280',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Preferences</div>
        <Card style={{marginBottom:14,display:'flex',flexDirection:'column',gap:12}} ch={<>
          <div><div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>Weight Units</div>
            <div style={{display:'flex',gap:8}}><Pill a={u==='kg'} on={()=>{setU('kg');onSave({name:nm,unit:'kg',planId:p});}} l="kg"/><Pill a={u==='lbs'} on={()=>{setU('lbs');onSave({name:nm,unit:'lbs',planId:p});}} l="lbs"/></div>
          </div>
          <div><div style={{fontSize:12,color:'#9CA3AF',fontWeight:600,marginBottom:7}}>Active Programme</div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A0A0A',border:'1px solid '+B,borderRadius:10,padding:'10px 12px'}}>
              <div style={{fontSize:14,fontWeight:700}}>{PROGS[p].name}</div>
              <Btn onClick={()=>setShowP(!showP)} ch="Change" style={{height:28,padding:'0 10px',borderRadius:7,background:'#1E1E1E',border:'1px solid '+B,color:'#9CA3AF',fontSize:11,fontWeight:700}}/>
            </div>
            {showP&&<div style={{marginTop:8,display:'flex',flexDirection:'column',gap:8}}>
              {Object.values(PROGS).map(prog=><div key={prog.id} onClick={()=>{setP(prog.id);setShowP(false);onSave({name:nm,unit:u,planId:prog.id});}}
                style={{background:'#0A0A0A',border:'2px solid '+(p===prog.id?A:B),borderRadius:12,padding:12,cursor:'pointer',position:'relative'}}>
                <div style={{fontSize:13,fontWeight:800,marginBottom:2}}>{prog.name}</div>
                <div style={{fontSize:11,color:'#9CA3AF'}}>{prog.freq}</div>
                {p===prog.id&&<div style={{position:'absolute',top:10,right:10,width:18,height:18,borderRadius:'50%',background:A,color:'#000',fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>&#10003;</div>}
              </div>)}
            </div>}
          </div>
        </>}/>
        <div style={{fontSize:11,color:'#6B7280',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Data</div>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
          <Btn onClick={()=>setConfirm('prog')} ch="Reset Current Programme" style={{width:'100%',height:46,borderRadius:10,background:S,border:'1px solid '+B,color:'#fff',fontSize:13,fontWeight:700}}/>
          <Btn onClick={()=>setConfirm('all')} ch="Reset Everything" style={{width:'100%',height:46,borderRadius:10,background:S,border:'1px solid #7f1d1d',color:'#f87171',fontSize:13,fontWeight:700}}/>
        </div>
        <div style={{fontSize:11,color:'#6B7280',lineHeight:1.5}}>Version 1.0 &mdash; Evidence-based hypertrophy design.</div>
      </div>
      {confirm&&<>
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:50}}/>
        <div style={{position:'fixed',left:20,right:20,top:'50%',transform:'translateY(-50%)',background:'#161616',border:'1px solid '+B,borderRadius:16,padding:20,zIndex:51}}>
          <div style={{fontSize:15,fontWeight:800,marginBottom:7}}>{confirm==='all'?'Delete All Data?':'Reset Programme?'}</div>
          <div style={{fontSize:13,color:'#9CA3AF',lineHeight:1.5,marginBottom:14}}>{confirm==='all'?'Permanently deletes all history, streaks and preferences.':'Deletes all workouts for the current programme.'}</div>
          <div style={{display:'flex',gap:8}}>
            <Btn onClick={()=>setConfirm(null)} ch="Cancel" style={{flex:1,height:44,borderRadius:10,background:'transparent',border:'1px solid '+B,color:'#fff',fontSize:13,fontWeight:700}}/>
            <Btn onClick={()=>{confirm==='all'?onResetAll():onReset(p);setConfirm(null);}} ch={confirm==='all'?'Delete Everything':'Reset'} style={{flex:1,height:44,borderRadius:10,background:'#DC2626',color:'#fff',fontSize:13,fontWeight:700}}/>
          </div>
        </div>
      </>}
    </FS>
  );
}

// ── MILESTONE ─────────────────────────────────────────────────────────────────
function Milestone({days,onClose}){
  return<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:80,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,textAlign:'center'}}>
    <div style={{fontSize:56,marginBottom:8}}>{days>=30?'\uD83C\uDFC6':days>=14?'\uD83D\uDCAA':'\uD83D\uDD25'}</div>
    <div style={{fontSize:22,fontWeight:800,marginBottom:6}}>{days}-Day Streak!</div>
    <div style={{fontSize:14,color:'#9CA3AF',marginBottom:24}}>You're building serious consistency.</div>
    <Btn onClick={onClose} ch="Nice!" style={{width:'100%',height:50,borderRadius:12,background:'linear-gradient(135deg,#065F46,'+A+')',color:'#000',fontSize:16,fontWeight:800}}/>
  </div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [ready,setReady]=useState(false);
  const [ob,setOb]=useState(false);
  const [name,setName]=useState('');
  const [unit,setUnit]=useState('kg');
  const [planId,setPlanId]=useState('ppl');
  const [hist,setHist]=useState([]);
  const [streak,setStreak]=useState(DEF_ST);
  const [cel,setCel]=useState([]);
  const [swaps,setSwaps]=useState({});
  const [nutrIn,setNutrIn]=useState(null);
  const [nutrRes,setNutrRes]=useState(null);
  const [tab,setTab]=useState('home');
  const [screen,setScreen]=useState('home');
  const [aS,setAS]=useState(null);  // active session {sess, planId}
  const [comp,setComp]=useState(null);
  const [mile,setMile]=useState(null);

  useEffect(()=>{
    setOb(ld(K.ob,false));setName(ld(K.nm,''));setUnit(ld(K.ut,'kg'));setPlanId(ld(K.pl,'ppl'));
    const rh=ld(K.hi,[]);setHist(Array.isArray(rh)?rh.map(h=>({...h,exercises:Array.isArray(h.exercises)?h.exercises.map(e=>({...e,sets:Array.isArray(e.sets)?e.sets:[],notes:e.notes||''})):[]})):[]);
    const rs=ld(K.st,DEF_ST);setStreak({...DEF_ST,...rs,dates:Array.isArray(rs.dates)?rs.dates:[],total:rs.total||0});
    setCel(ld(K.cl,[]));setSwaps(ld(K.sw,{})||{});setNutrIn(ld(K.nu,null));setNutrRes(ld(K.nr,null));
    setTimeout(()=>setReady(true),300);
  },[]);

  function savePrefs({name:nm,unit:u,planId:p}){setName(nm);setUnit(u);setPlanId(p);sv(K.nm,nm);sv(K.ut,u);sv(K.pl,p);}
  function saveSwap(key,val){const ns=val!=null?{...swaps,[key]:val}:(()=>{const c={...swaps};delete c[key];return c;})();setSwaps(ns);sv(K.sw,ns);}

  function startSess(sess,pid){setAS({sess,planId:pid||planId});setScreen('session');}

  function finishWorkout(entry,prs,dur,toIncrease){
    const nh=[entry,...hist];setHist(nh);sv(K.hi,nh);
    const today=new Date().toISOString().slice(0,10);
    const st=streak;let cur=st.cur;
    if(!st.lastDate)cur=1;else{const gap=Math.round((new Date(today)-new Date(st.lastDate))/86400000);cur=gap===0?(st.cur||1):gap<=2?st.cur+1:1;}
    const ns={cur,best:Math.max(st.best,cur),lastDate:today,total:st.total+1,dates:st.dates.includes(today)?st.dates:[...st.dates,today]};
    setStreak(ns);sv(K.st,ns);
    const MILES=[7,14,30];
    if(MILES.includes(cur)&&!cel.includes(cur)){const nc=[...cel,cur];setCel(nc);sv(K.cl,nc);setMile(cur);}
    setComp({entry,prs:prs||[],duration:dur||0,toIncrease:toIncrease||[]});setScreen('complete');setAS(null);
  }

  const showTab=!['session','workout','complete'].includes(screen);
  const TABS=[{id:'home',l:'Home',e:'\uD83C\uDFE0'},{id:'programmes',l:'Plans',e:'\uD83D\uDCCB'},{id:'progress',l:'Log',e:'\uD83D\uDCCA'},{id:'nutrition',l:'Nutrition',e:'\uD83D\uDD25'},{id:'settings',l:'Settings',e:'\u2699\uFE0F'}];

  if(!ready)return<div style={{position:'fixed',inset:0,background:'#0A0A0A',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{fontSize:18,fontWeight:800,color:A}}>CONSTANTINE FITNESS</div></div>;
  if(!ob)return<Onboarding onDone={({name:n,plan:p,unit:u})=>{setName(n);setPlanId(p);setUnit(u);setOb(true);sv(K.nm,n);sv(K.pl,p);sv(K.ut,u);sv(K.ob,true);}}/>;

  return(
    <>
      {/* Screen area — position:relative so child position:absolute fills it */}
      <div style={{flex:1,position:'relative',overflow:'hidden'}}>
        {screen==='home'&&<Home planId={planId} hist={hist} streak={streak} onStart={sess=>startSess(sess,planId)} onSettings={()=>setScreen('settings')}/>}
        {screen==='programmes'&&<Programmes planId={planId} onStart={(sess,pid)=>startSess(sess,pid)}/>}
        {screen==='session'&&aS&&<SessionOverview planId={aS.planId} sess={aS.sess} hist={hist} unit={unit} swaps={swaps} onSaveSwap={saveSwap} onBegin={()=>setScreen('workout')} onBack={()=>{setScreen(tab);setAS(null);}}/>}
        {screen==='progress'&&<Progress hist={hist} unit={unit}/>}
        {screen==='nutrition'&&<Nutrition saved={nutrIn} savedRes={nutrRes} onSave={v=>{setNutrIn(v);sv(K.nu,v);}} onSaveRes={v=>{setNutrRes(v);sv(K.nr,v);}}/>}
        {screen==='settings'&&<Settings name={name} unit={unit} planId={planId} onSave={savePrefs}
          onReset={pid=>{const nh=hist.filter(h=>h.planId!==pid);setHist(nh);sv(K.hi,nh);setStreak(s=>({...s,cur:0}));setScreen('home');setTab('home');}}
          onResetAll={()=>{Object.values(K).forEach(k=>{try{localStorage.removeItem(k);}catch{}});setOb(false);setName('');setUnit('kg');setPlanId('ppl');setHist([]);setStreak(DEF_ST);setCel([]);setSwaps({});setNutrIn(null);setNutrRes(null);}}
          onClose={()=>setScreen(tab)}/>}
        {screen==='complete'&&comp&&<WorkoutComplete entry={comp.entry} unit={unit} prs={comp.prs} duration={comp.duration} toIncrease={comp.toIncrease} onHome={()=>{setComp(null);setScreen('home');setTab('home');}}/>}
        {/* Workout — position:absolute same as all other working screens */}
        {screen==='workout'&&aS&&<ActiveWorkout planId={aS.planId} sess={aS.sess} hist={hist} unit={unit} swaps={swaps} onSaveSwap={saveSwap} onDone={finishWorkout} onExit={()=>{setScreen(tab);setAS(null);}}/>}
      </div>
      {/* Tab bar */}
      {showTab&&<div style={{display:'flex',borderTop:'1px solid '+B,background:'#0A0A0A',padding:'6px 4px 26px',flexShrink:0}}>
        {TABS.map(t=><div key={t.id} onClick={()=>{setTab(t.id);setScreen(t.id);}} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'4px 0',cursor:'pointer',minHeight:44,justifyContent:'center'}}>
          <div style={{fontSize:18}}>{t.e}</div>
          <div style={{fontSize:10,fontWeight:600,color:tab===t.id?A:'#6B7280'}}>{t.l}</div>
        </div>)}
      </div>}
      {mile&&<Milestone days={mile} onClose={()=>setMile(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
